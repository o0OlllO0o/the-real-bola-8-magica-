<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1f2e">
    <title>🔮 Bola Mágica 8 · Voz y Movimiento</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;background:linear-gradient(145deg,#1a1f2e 0%,#0a0d16 100%);color:#eee;padding:16px;}
        .app{max-width:600px;margin:0 auto;}
        .bola-header{text-align:center;margin-bottom:20px;}
        .contenedor-bola{background:radial-gradient(circle at 30% 25%,#2c3e50,#000000);border-radius:50%;padding:20px;box-shadow:0 25px 40px rgba(0,0,0,0.5);transition:all 0.3s ease;cursor:pointer;}
        .contenedor-bola.agitando{animation:shake 0.5s ease-in-out;background:radial-gradient(circle at 30% 25%,#3a5a6e,#000000);}
        @keyframes shake{0%{transform:translate(0,0) rotate(0deg);}20%{transform:translate(-6px,3px) rotate(-3deg);}40%{transform:translate(6px,-3px) rotate(3deg);}60%{transform:translate(-3px,2px) rotate(-2deg);}80%{transform:translate(3px,-2px) rotate(2deg);}100%{transform:translate(0,0) rotate(0deg);}}
        .cristal-bola{background:rgba(20,30,45,0.7);backdrop-filter:blur(5px);border-radius:50%;padding:25px 15px;min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;}
        .cita{font-size:1.2rem;line-height:1.4;font-style:italic;color:#f8f3e8;margin-bottom:10px;}
        .autor{font-size:0.9rem;color:#e6c89a;}
        .filtros-acumulador{background:rgba(0,0,0,0.3);border-radius:20px;padding:12px;margin:15px 0;}
        .filtros-titulo{font-size:0.75rem;text-transform:uppercase;opacity:0.6;margin-bottom:8px;}
        .filtros-lista{display:flex;flex-wrap:wrap;gap:8px;}
        .filtro-tag{background:#2c3e50;padding:6px 12px;border-radius:20px;font-size:0.8rem;display:inline-flex;align-items:center;gap:8px;}
        .filtro-tag .remove{background:none;border:none;color:#e6c89a;cursor:pointer;font-size:1rem;padding:0 4px;}
        .chat-area{background:rgba(255,255,255,0.05);border-radius:20px;padding:15px;margin:15px 0;max-height:300px;overflow-y:auto;}
        .chat-mensaje{background:#2a2a3a;border-radius:18px;padding:12px 16px;margin-bottom:12px;font-size:0.9rem;}
        .chat-mensaje.bot{background:#2c3e50;border-bottom-left-radius:4px;}
        .chat-mensaje.usuario{background:#e6c89a;color:#1e2a36;text-align:right;border-bottom-right-radius:4px;}
        .sugerencias{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0;}
        .sugerencia-btn{background:#3a4a5e;border:none;color:#fff;padding:8px 16px;border-radius:30px;font-size:0.85rem;cursor:pointer;}
        .input-area{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;}
        input{flex:1;padding:12px;border-radius:30px;border:none;background:#2a2a3a;color:#fff;font-size:0.9rem;outline:none;min-width:120px;}
        button{background:#e6c89a;border:none;color:#1e2a36;font-weight:bold;padding:12px 20px;border-radius:30px;cursor:pointer;}
        .microfono-btn{background:#5a7a9e;color:#fff;}
        .microfono-btn.grabando{background:#e74c3c;animation:pulse 1s infinite;}
        @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}
        .shake-hint{text-align:center;font-size:0.7rem;opacity:0.5;margin-top:15px;}
        .activar-shake{background:#5a7a9e;margin-top:10px;padding:8px;border-radius:20px;font-size:0.75rem;text-align:center;cursor:pointer;}
        .permisos-panel{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;justify-content:center;}
        .permiso-btn{background:#3a4a5e;padding:6px 12px;border-radius:20px;font-size:0.7rem;cursor:pointer;}
    </style>
</head>
<body>
<div class="app">
    <div class="bola-header">
        <div class="contenedor-bola" id="bola">
            <div class="cristal-bola">
                <p class="cita" id="cita">🔮 Selecciona filtros, escribe o habla...</p>
                <p class="autor" id="autor">— Asistente Mágico</p>
            </div>
        </div>
    </div>
    
    <div class="permisos-panel" id="permisosPanel">
        <div class="permiso-btn" id="permisoMicrofonoBtn">🎤 Activar micrófono</div>
        <div class="permiso-btn" id="permisoMovimientoBtn" style="display:none;">📱 Activar agitado</div>
    </div>
    
    <div class="filtros-acumulador" id="filtrosAcumulador" style="display:none;">
        <div class="filtros-titulo">🎯 Filtros activos:</div>
        <div class="filtros-lista" id="filtrosLista"></div>
    </div>
    
    <div class="chat-area" id="chatArea">
        <div class="chat-mensaje bot" id="chatInicial">
            🔮 ¡Hola! Soy la Bola Mágica. ¿Con quién compartirás esta sabiduría?
        </div>
        <div class="sugerencias" id="sugerencias"></div>
    </div>
    
    <div class="input-area">
        <input type="text" id="pregunta" placeholder="Escribe tu pregunta..." autocomplete="off">
        <button id="enviarBtn">🔮 Preguntar / Agitar</button>
        <button id="microfonoBtn" class="microfono-btn">🎤 Hablar</button>
    </div>
    <div class="shake-hint" id="shakeHint">📱 Agita la bola para respuesta aleatoria</div>
    <div class="activar-shake" id="activarShakeBtn" style="display:none;">🎯 Tocar para activar agitado (iOS)</div>
</div>

<script>
    // ============================================================
    // BASE DE DATOS DE RESPUESTAS
    // ============================================================
    const respuestasPorFiltro = {
        familia: ["La familia es como un buen guiso: a veces sale mal, pero siempre alimenta el alma 🍲","El amor familiar es el único que no necesita WiFi","Tu familia te apoya... aunque no entiendan nada","Reunión familiar = amor + preguntas incómodas + comida 🛡️","La sangre tira más que el cable del cargador"],
        solo: ["La soledad es tu mejor maestra... y no cobra matrícula 🧘","Estar solo es tener el mando de la tele siempre para ti","La mejor compañía eres tú mismo","La independencia es como la batería: dura más 🔋","A solas con tus pensamientos... espero que sean buena gente"],
        mascotas: ["Tu mascota te quiere incondicionalmente. Sobre todo si tienes comida 🐕","Los perros te miran como si fueras un héroe. Los gatos, como su sirviente","La lealtad de un animal es más pura que la humana 🐱","Pasea a tu mascota. Ella te pasea el alma","Ellos no entienden tus problemas, pero entienden cuando estás tristes"],
        pareja: ["El amor es como las plantas: hay que regarlo, sin ahogarlo 💑","La pareja perfecta no existe. La que se ríe de tus chistes malos","Discutir por la manta es parte del plan. El amor también es frío ❄️","El amor dura como un cargador nuevo... si lo cuidas, mucho más","Las relaciones son como el software: necesitan actualizaciones"],
        amigos: ["Los amigos son la familia que eliges... y que te aguanta 🍻","Un amigo te ayuda a mover el sofá... y se queda a ver la tele","La amistad es como el WiFi gratis: cuando la tienes es oro","Los verdaderos amigos te dicen 'tienes algo en el diente'","Amigos: esos que conocen tu música rara y no te juzgan 🎵"]
    };
    const respuestasGenerales = ["La sabiduría está en escuchar más de lo que hablas... pero yo soy una bola","El universo conspira a tu favor... cuando se acuerda","La respuesta está dentro de ti. Y también dentro de este código","La vida es como una cebolla: tiene capas, y a veces te hace llorar 🧅","No hay preguntas tontas, solo respuestas surrealistas"];
    
    // Estado
    let filtrosActivos = [];
    let reconocimiento = null;
    let grabando = false;
    let shakeActivado = false;
    let ultimoAgite = 0;
    let ultimaX=0, ultimaY=0, ultimaZ=0;
    
    // Elementos DOM
    const bola = document.getElementById('bola');
    const cita = document.getElementById('cita');
    const autor = document.getElementById('autor');
    const filtrosAcumulador = document.getElementById('filtrosAcumulador');
    const filtrosLista = document.getElementById('filtrosLista');
    const chatArea = document.getElementById('chatArea');
    const sugerenciasDiv = document.getElementById('sugerencias');
    const inputPregunta = document.getElementById('pregunta');
    const enviarBtn = document.getElementById('enviarBtn');
    const microfonoBtn = document.getElementById('microfonoBtn');
    const shakeHint = document.getElementById('shakeHint');
    const activarShakeBtn = document.getElementById('activarShakeBtn');
    const permisoMicrofonoBtn = document.getElementById('permisoMicrofonoBtn');
    const permisoMovimientoBtn = document.getElementById('permisoMovimientoBtn');
    
    // ============================================================
    // FUNCIONES PRINCIPALES
    // ============================================================
    function actualizarFiltrosUI() {
        if (filtrosActivos.length === 0) { filtrosAcumulador.style.display = 'none'; return; }
        filtrosAcumulador.style.display = 'block';
        filtrosLista.innerHTML = '';
        filtrosActivos.forEach(filtro => {
            const tag = document.createElement('div');
            tag.className = 'filtro-tag';
            tag.innerHTML = `${filtro} <button class="remove" data-filtro="${filtro}">✕</button>`;
            filtrosLista.appendChild(tag);
        });
        document.querySelectorAll('.filtro-tag .remove').forEach(btn => {
            btn.addEventListener('click', (e) => {
                filtrosActivos = filtrosActivos.filter(f => f !== btn.dataset.filtro);
                actualizarFiltrosUI();
                regenerarSugerencias();
            });
        });
    }
    
    function agregarMensaje(texto, esUsuario = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `chat-mensaje ${esUsuario ? 'usuario' : 'bot'}`;
        msgDiv.textContent = texto;
        chatArea.insertBefore(msgDiv, sugerenciasDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }
    
    function regenerarSugerencias() {
        sugerenciasDiv.innerHTML = '';
        const todos = ['familia', 'solo', 'mascotas', 'pareja', 'amigos'];
        const disponibles = todos.filter(f => !filtrosActivos.includes(f));
        if (disponibles.length === 0) {
            sugerenciasDiv.innerHTML = '<span style="opacity:0.6;">✅ Todos los filtros activados. Elimina alguno.</span>';
            return;
        }
        disponibles.forEach(filtro => {
            const btn = document.createElement('button');
            btn.className = 'sugerencia-btn';
            btn.textContent = filtro;
            btn.addEventListener('click', () => {
                if (!filtrosActivos.includes(filtro)) {
                    filtrosActivos.push(filtro);
                    actualizarFiltrosUI();
                    agregarMensaje(`✅ Añadido filtro: ${filtro}`);
                    regenerarSugerencias();
                }
            });
            sugerenciasDiv.appendChild(btn);
        });
    }
    
    function obtenerRespuesta() {
        let respuestasPosibles = [];
        for (let filtro of filtrosActivos) {
            if (respuestasPorFiltro[filtro]) respuestasPosibles.push(...respuestasPorFiltro[filtro]);
        }
        if (respuestasPosibles.length === 0) respuestasPosibles = respuestasGenerales;
        return respuestasPosibles[Math.floor(Math.random() * respuestasPosibles.length)];
    }
    
    // Función para vibración (si está disponible)
    function vibrar() {
        if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(200);
        }
    }
    
    function mostrarRespuesta(pregunta) {
        if (!pregunta.trim()) { 
            cita.textContent = "🔮 Escribe o habla una pregunta..."; 
            return false;
        }
        cita.textContent = "🔮 La bola está meditando... 🔮";
        vibrar(); // Vibración al recibir respuesta
        setTimeout(() => {
            const respuesta = obtenerRespuesta();
            cita.textContent = `"${respuesta}"`;
            autor.textContent = filtrosActivos.length ? `— Bola Mágica (${filtrosActivos.join(', ')})` : '— Bola Mágica';
            agregarMensaje(`❓ "${pregunta}"`, true);
            agregarMensaje(respuesta, false);
            inputPregunta.value = '';
        }, 400);
        return true;
    }
    
    // Función que simula AGITAR: respuesta aleatoria sin pregunta
    function agitarAleatorio() {
        cita.textContent = "🔮 La bola se agita... 🔮";
        vibrar(); // Vibración al agitar
        setTimeout(() => {
            const respuesta = obtenerRespuesta();
            cita.textContent = `"${respuesta}"`;
            autor.textContent = filtrosActivos.length ? `— Bola Mágica (${filtrosActivos.join(', ')})` : '— Bola Mágica';
            agregarMensaje(`🎲 La bola se agitó aleatoriamente`, false);
            agregarMensaje(respuesta, false);
        }, 400);
    }
    
    function animarAgitar() {
        bola.classList.add('agitando');
        setTimeout(() => bola.classList.remove('agitando'), 500);
        
        // Comportamiento inteligente del botón:
        // Si hay texto en el input -> responde a la pregunta
        // Si no hay texto -> simula agitado aleatorio
        if (inputPregunta.value.trim()) {
            mostrarRespuesta(inputPregunta.value);
        } else {
            agitarAleatorio();
        }
    }
    
    // ============================================================
    // MICRÓFONO (Reconocimiento de Voz)
    // ============================================================
    function iniciarMicrofono() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            agregarMensaje("❌ Tu navegador no soporta reconocimiento de voz.");
            return;
        }
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        reconocimiento = new SpeechRecognition();
        reconocimiento.lang = 'es-ES';
        reconocimiento.continuous = false;
        reconocimiento.interimResults = false;
        
        reconocimiento.onstart = () => {
            grabando = true;
            microfonoBtn.classList.add('grabando');
            microfonoBtn.textContent = '🔴 Grabando...';
            agregarMensaje("🎤 Escuchando... habla ahora");
        };
        
        reconocimiento.onresult = (event) => {
            const texto = event.results[0][0].transcript;
            inputPregunta.value = texto;
            agregarMensaje(`🎤 Dijiste: "${texto}"`, true);
            mostrarRespuesta(texto);
        };
        
        reconocimiento.onerror = (event) => {
            console.error('Error:', event.error);
            agregarMensaje(`❌ Error de micrófono: ${event.error}`);
            detenerMicrofono();
        };
        
        reconocimiento.onend = () => {
            detenerMicrofono();
        };
        
        reconocimiento.start();
    }
    
    function detenerMicrofono() {
        if (reconocimiento) {
            try { reconocimiento.stop(); } catch(e) {}
        }
        grabando = false;
        microfonoBtn.classList.remove('grabando');
        microfonoBtn.textContent = '🎤 Hablar';
    }
    
    function toggleMicrofono() {
        if (grabando) {
            detenerMicrofono();
        } else {
            if (reconocimiento) {
                try { reconocimiento.start(); } catch(e) { iniciarMicrofono(); }
            } else {
                iniciarMicrofono();
            }
        }
    }
    
    // ============================================================
    // MOVIMIENTO (Giroscopio / Agitado)
    // ============================================================
    function iniciarDeteccionMovimiento() {
        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', function(e) {
                const ahora = Date.now();
                if (ahora - ultimoAgite < 800) return;
                const acc = e.accelerationIncludingGravity;
                if (!acc) return;
                const x = acc.x || 0, y = acc.y || 0, z = acc.z || 0;
                const fuerza = Math.abs(x - ultimaX) + Math.abs(y - ultimaY) + Math.abs(z - ultimaZ);
                if (fuerza > 25) {
                    ultimoAgite = ahora;
                    // Cuando se agita físicamente, comportamiento aleatorio
                    bola.classList.add('agitando');
                    setTimeout(() => bola.classList.remove('agitando'), 500);
                    agitarAleatorio();
                }
                ultimaX = x; ultimaY = y; ultimaZ = z;
            });
            shakeActivado = true;
            shakeHint.textContent = "📱 ¡Agitado activado! Agita la bola";
            if(activarShakeBtn) activarShakeBtn.style.display = 'none';
            if(permisoMovimientoBtn) permisoMovimientoBtn.style.display = 'none';
        }
    }
    
    function solicitarPermisoMovimiento() {
        if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') {
                        iniciarDeteccionMovimiento();
                    } else {
                        shakeHint.textContent = "📱 Permiso denegado. Usa el botón.";
                    }
                })
                .catch(err => {
                    console.error(err);
                    shakeHint.textContent = "📱 Error al pedir permiso. Usa el botón.";
                });
        } else {
            iniciarDeteccionMovimiento();
        }
    }
    
    // ============================================================
    // PERMISOS INICIALES
    // ============================================================
    function solicitarPermisoMicrofono() {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(() => {
                agregarMensaje("✅ Micrófono activado. Puedes usar el botón 🎤");
                permisoMicrofonoBtn.style.display = 'none';
            })
            .catch(err => {
                agregarMensaje("❌ No se pudo acceder al micrófono. Usa el teclado.");
                console.error(err);
            });
    }
    
    // Eventos UI
    microfonoBtn.addEventListener('click', toggleMicrofono);
    enviarBtn.addEventListener('click', animarAgitar);
    inputPregunta.addEventListener('keypress', (e) => { if (e.key === 'Enter') animarAgitar(); });
    bola.addEventListener('click', animarAgitar);
    permisoMicrofonoBtn.addEventListener('click', solicitarPermisoMicrofono);
    
    // Configurar agitado según plataforma
    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
        shakeHint.textContent = "📱 iOS: toca 'Activar agitado' para usar el giroscopio";
        activarShakeBtn.style.display = 'block';
        permisoMovimientoBtn.style.display = 'block';
        activarShakeBtn.addEventListener('click', solicitarPermisoMovimiento);
        permisoMovimientoBtn.addEventListener('click', solicitarPermisoMovimiento);
    } else if (window.DeviceMotionEvent) {
        iniciarDeteccionMovimiento();
    } else {
        shakeHint.textContent = "🔮 Tu dispositivo no soporta agitado. Usa botón o voz.";
    }
    
    // Inicializar
    actualizarFiltrosUI();
    regenerarSugerencias();
    
    // Mensaje de bienvenida con instrucciones
    setTimeout(() => {
        agregarMensaje("🎤 Puedes usar el micrófono para hablar tu pregunta");
        agregarMensaje("📱 El botón 'Preguntar/Agitar' hace ambas cosas: si escribes pregunta, responde; si no, da una respuesta aleatoria como si agitaras");
    }, 1000);
</script>
</body>
</html>
