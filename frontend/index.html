<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>🎱 Bola Mágica 8 - Sabiduría Ancestral</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{min-height:100vh;background:radial-gradient(ellipse at center, #1a1a2e 0%, #000000 70%, #000000 100%);display:flex;justify-content:center;align-items:center;font-family:'Segoe UI','Helvetica Neue',sans-serif;padding:16px;position:relative;overflow-x:hidden;}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 45%, rgba(80,100,150,0.12) 0%, transparent 60%);pointer-events:none;z-index:0;}
        .container{width:100%;display:flex;justify-content:center;align-items:center;flex-direction:column;position:relative;z-index:1;}
        .scene{width:min(85vw,85vh,420px);height:min(85vw,85vh,420px);position:relative;cursor:pointer;perspective:1200px;}
        .scene::after{content:'';position:absolute;bottom:-20px;left:15%;width:70%;height:20px;background:radial-gradient(ellipse, rgba(0,0,0,0.5), transparent);border-radius:50%;filter:blur(6px);z-index:-1;}
        .bola{width:100%;height:100%;position:relative;transition:transform 0.6s cubic-bezier(0.4,0.2,0.2,1);transform-style:preserve-3d;border-radius:50%;animation:rotateIn 1s ease-out;}
        @keyframes rotateIn{0%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
        
        @keyframes shakeBola{0%,100%{transform:rotateY(180deg) translateX(0);}10%{transform:rotateY(180deg) translateX(-8px) rotateZ(-2deg);}20%{transform:rotateY(180deg) translateX(8px) rotateZ(2deg);}30%{transform:rotateY(180deg) translateX(-6px) rotateZ(-1.5deg);}40%{transform:rotateY(180deg) translateX(6px) rotateZ(1.5deg);}50%{transform:rotateY(180deg) translateX(-4px) rotateZ(-1deg);}60%{transform:rotateY(180deg) translateX(4px) rotateZ(1deg);}70%{transform:rotateY(180deg) translateX(-2px) rotateZ(-0.5deg);}80%{transform:rotateY(180deg) translateX(2px) rotateZ(0.5deg);}90%{transform:rotateY(180deg) translateX(0) rotateZ(0deg);}}
        .bola.shaking{animation:shakeBola 0.8s cubic-bezier(0.36,0.07,0.19,0.97) forwards;}
        
        @keyframes particula1{0%{opacity:0;transform:translate(0,0) scale(0);}50%{opacity:1;transform:translate(-30px,-40px) scale(1);}100%{opacity:0;transform:translate(-60px,-80px) scale(0);}}
        @keyframes particula2{0%{opacity:0;transform:translate(0,0) scale(0);}50%{opacity:1;transform:translate(30px,-50px) scale(1);}100%{opacity:0;transform:translate(60px,-100px) scale(0);}}
        @keyframes particula3{0%{opacity:0;transform:translate(0,0) scale(0);}50%{opacity:1;transform:translate(-20px,-60px) scale(1);}100%{opacity:0;transform:translate(-40px,-120px) scale(0);}}
        .particula{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:300;}
        .particula.p1{background:#8cf;animation:particula1 0.8s ease-out forwards;}
        .particula.p2{background:#f8f;animation:particula2 0.8s ease-out forwards;}
        .particula.p3{background:#8fc;animation:particula3 0.8s ease-out forwards;}
        
        .cara{position:absolute;width:100%;height:100%;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;}
        .cara.front{background:radial-gradient(circle at 35% 35%, #2a2a2a, #080808);transform:rotateY(0deg);box-shadow:inset 0 -25px 35px rgba(0,0,0,0.5),inset 0 25px 30px rgba(255,255,255,0.08),0 25px 35px rgba(0,0,0,0.6);}
        .cara.back{background:radial-gradient(circle at 35% 35%, #2a2a2a, #080808);transform:rotateY(180deg);padding:12%;pointer-events:auto;box-shadow:inset 0 -25px 35px rgba(0,0,0,0.5),inset 0 25px 30px rgba(255,255,255,0.08),0 25px 35px rgba(0,0,0,0.6);}
        .numero-8{width:45%;height:45%;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 20px rgba(0,0,0,0.4);}
        .numero-8 span{font-size:clamp(2.5rem,12vw,5rem);font-weight:900;color:#111;font-family:'Impact','Arial Black',sans-serif;}
        .transformable-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;}
        .triangulo-shape{width:85%;height:75%;background:#0a0a0a;clip-path:polygon(50% 8%,6% 92%,94% 92%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14% 8% 18% 8%;border:1px solid rgba(80,180,255,0.3);border-radius:10px;box-shadow:inset 0 0 20px rgba(80,160,255,0.08),0 5px 15px rgba(0,0,0,0.3);transition:all 0.6s cubic-bezier(0.2,0.9,0.4,1.1);}
        .triangulo-shape.cuadrado{width:92%;height:88%;clip-path:polygon(0% 0%,100% 0%,100% 100%,0% 100%);border-radius:20px;padding:16px;background:#0a0a0a;}
        .texto-container{width:100%;position:relative;display:flex;flex-direction:column;gap:12px;}
        .texto-multifuncional{width:100%;background:#0a0a0a;border:1px solid rgba(80,180,255,0.4);border-radius:16px;padding:14px 12px;color:#e0f0ff;font-size:clamp(0.7rem,3.5vw,0.9rem);font-family:inherit;text-align:center;resize:none;outline:none;word-break:break-word;min-height:100px;height:auto;line-height:1.4;transition:all 0.3s ease;}
        .texto-multifuncional:focus{border-color:#8cf;box-shadow:0 0 10px rgba(100,160,255,0.3);}
        
        .iconos-barra{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:8px;}
        .icono-accion{background:#1a2a3a;border:1px solid #3a5a7a;color:#cceeff;width:44px;height:44px;border-radius:44px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;transition:all 0.2s;position:relative;}
        .icono-accion:active{transform:scale(0.95);background:#2a4a6a;}
        .icono-accion.grabando{background:#e74c3c;border-color:#f88;animation:pulse 1s infinite;}
        
        /* Botón PLAY principal con brillo elegante */
        .icono-accion.principal{
            width:52px;height:52px;font-size:1.4rem;
            background:linear-gradient(135deg,#1a2a3a 0%,#0d1b2a 100%);
            border:2px solid rgba(136,204,255,0.6);
            box-shadow:0 0 15px rgba(100,160,255,0.2);
            overflow:hidden;
        }
        .icono-accion.principal::before{
            content:'';
            position:absolute;
            top:-50%;left:-50%;
            width:200%;height:200%;
            background:linear-gradient(45deg,transparent 40%,rgba(136,204,255,0.15) 45%,rgba(136,204,255,0.3) 50%,rgba(136,204,255,0.15) 55%,transparent 60%);
            animation:shimmer 3s infinite;
            z-index:1;
        }
        .icono-accion.principal::after{
            content:'';
            position:absolute;
            inset:-3px;
            border-radius:55px;
            background:transparent;
            border:1px solid rgba(136,204,255,0.25);
            animation:borderPulse 2.5s infinite;
        }
        .icono-accion.principal span.play-icon{
            position:relative;z-index:2;
            display:flex;align-items:center;justify-content:center;
            margin-left:3px;
        }
        .icono-accion.principal:active{transform:scale(0.92);box-shadow:0 0 25px rgba(100,160,255,0.5);}
        
        @keyframes shimmer{0%{transform:translateX(-100%) rotate(45deg);}100%{transform:translateX(100%) rotate(45deg);}}
        @keyframes borderPulse{0%,100%{opacity:0.3;transform:scale(1);}50%{opacity:0.8;transform:scale(1.06);}}
        @keyframes pulse{0%{opacity:0.7;transform:scale(1);}100%{opacity:1;transform:scale(1.05);}}
        
        .btn-modo,.btn-voz{position:fixed;top:16px;left:16px;background:#1a1a1a;border:1px solid #3a5a7a;color:#cceeff;width:44px;height:44px;border-radius:44px;font-size:1.3rem;cursor:pointer;z-index:200;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
        .btn-voz{left:68px;}
        .btn-modo:active,.btn-voz:active{transform:scale(0.95);background:#2a2a2a;}
        
        .modo-panel,.voz-panel{position:fixed;top:70px;left:16px;background:rgba(0,0,0,0.95);backdrop-filter:blur(12px);border-radius:20px;padding:12px;border:1px solid #3a5a7a;z-index:200;transform:translateX(-120%);transition:transform 0.3s ease;display:flex;flex-wrap:wrap;gap:10px;max-width:280px;}
        .voz-panel{max-width:320px;}
        .modo-panel.visible,.voz-panel.visible{transform:translateX(0);}
        .modo-opcion,.voz-opcion{background:#1a2a3a;border:1px solid #3a5a7a;border-radius:40px;padding:8px 12px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;font-size:0.7rem;color:#cceeff;}
        .modo-opcion:hover,.voz-opcion:hover{background:#2a4a6a;}
        .modo-opcion.activo,.voz-opcion.activo{background:#3a5a7a;border-color:#8cf;}
        
        .btn-stats{position:fixed;top:16px;right:16px;background:#1a1a1a;border:1px solid #3a5a7a;color:#cceeff;width:40px;height:40px;border-radius:40px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;z-index:200;backdrop-filter:blur(8px);}
        .btn-stats:active{transform:scale(0.95);background:#2a2a2a;}
        
        .info-externa{position:fixed;bottom:15px;left:0;right:0;text-align:center;font-size:0.6rem;color:#668;background:rgba(0,0,0,0.8);padding:6px;backdrop-filter:blur(4px);z-index:100;}
        .brillo{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.12),transparent 70%);pointer-events:none;}
        
        .stats-panel{position:fixed;bottom:120px;left:10px;right:10px;background:rgba(0,0,0,0.95);backdrop-filter:blur(12px);border-radius:20px;padding:12px;border:1px solid #3a5a7a;z-index:200;transform:translateY(calc(100% + 10px));transition:transform 0.3s ease;max-height:60vh;overflow-y:auto;visibility:hidden;opacity:0;}
        .stats-panel.visible{transform:translateY(0);visibility:visible;opacity:1;}
        .stats-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#aaf;border-bottom:1px solid #3a5a7a;padding-bottom:8px;}
        .stats-cerrar{background:none;border:none;color:#f88;font-size:1.2rem;cursor:pointer;padding:0 8px;}
        .stats-resumen{margin-bottom:10px;padding:8px;background:#0a0a0a;border-radius:12px;font-size:0.7rem;color:#aaf;}
        .stats-lista{font-size:0.7rem;color:#aaf;max-height:200px;overflow-y:auto;}
        .stats-item{padding:5px;border-bottom:1px solid #1a3a4a;}
    </style>
</head>
<body>
<div class="container">
    <div class="scene" id="scene">
        <div class="bola" id="bola">
            <div class="cara front"><div class="numero-8"><span>8</span></div><div class="brillo"></div></div>
            <div class="cara back" id="caraBack">
                <div class="transformable-container">
                    <div class="triangulo-shape" id="shapeElement">
                        <div class="texto-container">
                            <div class="texto-multifuncional" id="chatTexto" contenteditable="true" role="textbox" aria-multiline="true"></div>
                            <div class="iconos-barra">
                                <div class="icono-accion" id="reproducirBtn" title="Repetir última respuesta">🔄</div>
                                <div class="icono-accion principal" id="preguntarBtn" title="Consultar a la bola"><span class="play-icon">▶</span></div>
                                <div class="icono-accion" id="microBtn" title="Hablar por micrófono">🎤</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="brillo"></div>
            </div>
        </div>
    </div>
</div>

<div class="btn-modo" id="btnModo">🎭</div>
<div class="btn-voz" id="btnVoz">🎙️</div>
<div class="modo-panel" id="modoPanel">
    <div class="modo-opcion activo" data-modo="clasico"><span>🔮</span>Clásico</div>
    <div class="modo-opcion" data-modo="feminista"><span>🚺</span>Feminista</div>
    <div class="modo-opcion" data-modo="humor"><span>😂</span>Humor</div>
    <div class="modo-opcion" data-modo="sabiduria"><span>🌿</span>Estoico</div>
    <div class="modo-opcion" data-modo="feliz"><span>😊</span>Feliz</div>
    <div class="modo-opcion" data-modo="melancolico"><span>😢</span>Melancólico</div>
    <div class="modo-opcion" data-modo="motivacion"><span>💪</span>Motivación</div>
    <div class="modo-opcion" data-modo="calma"><span>🧘</span>Calma</div>
</div>
<div class="voz-panel" id="vozPanel">
    <div class="voz-opcion activo" data-voz="auto"><span>✨</span>Auto</div>
    <div class="voz-opcion" data-voz="grave"><span>🎸</span>Grave</div>
    <div class="voz-opcion" data-voz="aguda"><span>🎻</span>Aguda</div>
    <div class="voz-opcion" data-voz="calma"><span>🧘</span>Calma</div>
    <div class="voz-opcion" data-voz="motivador"><span>💪</span>Motivador</div>
    <div class="voz-opcion" data-voz="sabia"><span>🦉</span>Sabia</div>
</div>
<div class="btn-stats" id="statsBtn">📊</div>
<div class="info-externa">📱 Toca bola | 🎭 Modo | 🎙️ Voz | ▶ Preguntar | 🎤 Hablar | 🔄 Repetir</div>
<div class="stats-panel" id="statsPanel">
    <div class="stats-header"><span>📊 ESTADÍSTICAS</span><button class="stats-cerrar" id="statsCerrar">✕</button></div>
    <div class="stats-resumen" id="statsResumen"></div>
    <div class="stats-lista" id="statsLista"></div>
</div>

"«No busques fuera, la paz está dentro.» — Proverbio",
"«Cada día es una meditación si lo vives con calma.» — Proverbio",
"«La serenidad es el arte de vivir.» — Proverbio"
],
sabiduria:[
"«La sabiduría está en saber cuándo actuar y cuándo callar.» — Proverbio",
"«En el silencio encontramos las respuestas.» — Proverbio",
"«La paciencia es la mayor sabiduría.» — Proverbio",
"«Sabio es quien cultiva la calma en el caos.» — Proverbio",
"«La quietud es la puerta de la sabiduría.» — Proverbio",
"«Escucha el silencio, tiene mucho que enseñarte.» — Proverbio",
"«La sabiduría es hija de la reflexión serena.» — Proverbio",
"«No hay prisa para el que sabe esperar.» — Proverbio",
"«La calma es la firma de la inteligencia emocional.» — Proverbio",
"«El sabio encuentra paz donde otros encuentran ruido.» — Proverbio"
]}};

const modos={clasico:modoClasico,feminista:modoFeminista,humor:modoHumor,sabiduria:modoSabiduria,feliz:modoFeliz,melancolico:modoMelancolico,motivacion:modoMotivacion,calma:modoCalma};

let modoActual='clasico';
let modoActivo=modos[modoActual];
const respuestasSurrealistas=["«Los pingüinos usan esmoquin porque es el único traje que no les queda grande.»","«Si un libro te aburre, cámbiale el final. Tú eres el lector.»","«El tiempo vuela. Tú eres el piloto.»"];

const palabrasClave={amor:["amor","pareja","corazón","novio","novia","casar","romance","beso","enamorar","querer","relación","matrimonio","boda"],trabajo:["trabajo","oficina","jefe","empresa","ascender","curro","empleo","salario","sueldo","profesión","carrera","despido","renuncia","trabajar"],futuro:["futuro","pasará","destino","mañana","próximo","sucederá","ocurrirá","vendrá","porvenir","predicción","adivinar","profecía"],dinero:["dinero","rico","pobre","ganar","invertir","euro","millon","ahorrar","gastar","fortuna","moneda","billete","premio","lotería","riqueza","pobreza"],familia:["familia","madre","padre","hijo","hermano","abuela","tío","tía","primo","sobrino","familiar","hogar","casa","pareja","esposo","esposa","marido","mujer"],amigos:["amigo","amigos","amistad","compañero","colega","conocido","amistades","social","quedar"],exito:["éxito","triunfar","lograr","conseguir","meta","sueño","objetivo","ganar","vencer","superar","cumplir","alcanzar","victoria"],vida:["vida","vivir","muerte","existencia","nacer","morir","fallecer","destino","camino","sentido"]};

function detectarTema(pregunta){const texto=pregunta.toLowerCase();for(let[tema,palabras]of Object.entries(palabrasClave)){for(let palabra of palabras)if(texto.includes(palabra))return tema;}return'sabiduria';}

function obtenerCitaPorContexto(pregunta){const tema=detectarTema(pregunta);let citasDisponibles=modoActivo.citas[tema]||modoActivo.citas.sabiduria;let candidatas=citasDisponibles.filter(c=>!frasesUsadas.has(c));if(candidatas.length===0){frasesUsadas.clear();candidatas=citasDisponibles;}return candidatas[Math.floor(Math.random()*candidatas.length)];}

let sesionId=localStorage.getItem('bola8_sesion_id');if(!sesionId){sesionId='sesion_'+Date.now()+'_'+Math.random().toString(36).substr(2,8);localStorage.setItem('bola8_sesion_id',sesionId);}
let historial=JSON.parse(localStorage.getItem('bola8_historial_'+sesionId))||[];let frasesUsadas=new Set(historial.map(h=>h.respuesta));let contadorCategorias=JSON.parse(localStorage.getItem('bola8_categorias_'+sesionId))||{};

function guardarHistorial(){localStorage.setItem('bola8_historial_'+sesionId,JSON.stringify(historial));localStorage.setItem('bola8_categorias_'+sesionId,JSON.stringify(contadorCategorias));}
function registrarInteraccion(pregunta,respuesta,categoria){historial.unshift({timestamp:new Date().toISOString(),pregunta,respuesta,categoria});if(historial.length>100)historial.pop();frasesUsadas.add(respuesta);contadorCategorias[categoria]=(contadorCategorias[categoria]||0)+1;guardarHistorial();actualizarStatsUI();}
function obtenerCategoriaDeCita(cita){for(let[cat,citas]of Object.entries(modoActivo.citas)){if(citas.includes(cita))return cat;}return'sabiduria';}
function actualizarStatsUI(){document.getElementById('statsResumen').innerHTML='<strong>📊 RESUMEN</strong><br>🎱 PREGUNTAS: '+historial.length+'<br>💬 CITAS ÚNICAS: '+frasesUsadas.size+'<br>🎭 MODO: '+modoActivo.nombre+'<br>🎙️ VOZ: '+vozActual;let html='<strong>📜 ÚLTIMAS PREGUNTAS:</strong><br>';historial.slice(0,10).forEach((item,i)=>{html+='<div class="stats-item">'+(i+1)+'. ['+new Date(item.timestamp).toLocaleTimeString()+'] "'+item.pregunta.substring(0,35)+'..."<br>→ '+item.respuesta.substring(0,50)+'...</div>';});document.getElementById('statsLista').innerHTML=html||'AÚN NO HAY INTERACCIONES.';}
function toggleStats(){const panel=document.getElementById('statsPanel');panel.classList.toggle('visible');if(panel.classList.contains('visible'))actualizarStatsUI();}

function cambiarModo(modoId){modoActual=modoId;modoActivo=modos[modoId];frasesUsadas.clear();historial=[];contadorCategorias={};guardarHistorial();actualizarStatsUI();document.querySelectorAll('.modo-opcion').forEach(el=>{el.classList.toggle('activo',el.dataset.modo===modoId);});chatTexto.innerText='🎭 Modo '+modoActivo.nombre;setTimeout(()=>{if(chatTexto.innerText==='🎭 Modo '+modoActivo.nombre)chatTexto.innerText='';},2000);document.getElementById('modoPanel').classList.remove('visible');}

// VOCES
let reconocimiento=null,grabando=false,girada=false,ultimoAgite=0,ultimaX=0,ultimaY=0,ultimaZ=0;let synth=window.speechSynthesis;let vocesDisponibles=[];let vozActual='auto';let vozSeleccionada=null;let timeoutTransform=null;let ultimaRespuesta='';

const estilosVoz={auto:{preferencias:[]},grave:{preferencias:['grave','profunda','baja','seria']},aguda:{preferencias:['aguda','clara','juvenil','femenina']},calma:{preferencias:['calma','suave','lenta','pausada','tranquila']},motivador:{preferencias:['enérgica','potente','firme','dinámica']},sabia:{preferencias:['sabia','madura','profunda','pausada']}};

function cargarVoces(){if(!synth)return;vocesDisponibles=synth.getVoices();seleccionarVozPorEstilo(vozActual);}
function seleccionarVozPorEstilo(estilo){if(!synth||vocesDisponibles.length===0)return;let vocesEspanolas=vocesDisponibles.filter(v=>v.lang==='es-ES'||v.lang==='es_ES'||v.lang.startsWith('es-ES')||v.lang.startsWith('es_ES'));if(vocesEspanolas.length===0)vocesEspanolas=vocesDisponibles.filter(v=>v.lang.startsWith('es'));if(vocesEspanolas.length===0){vozSeleccionada=null;return;}if(estilo==='auto'){vozSeleccionada=vocesEspanolas.find(v=>v.name.includes('España')||v.name.includes('Spain'))||vocesEspanolas[0];}else{const preferencias=estilosVoz[estilo]?.preferencias||[];let mejorVoz=null;for(let pref of preferencias){mejorVoz=vocesEspanolas.find(v=>v.name.toLowerCase().includes(pref.toLowerCase()));if(mejorVoz)break;}if(!mejorVoz){mejorVoz=vocesEspanolas.find(v=>v.name.includes('España'))||vocesEspanolas[0];}vozSeleccionada=mejorVoz;}vozActual=estilo;localStorage.setItem('bola8_voz_estilo',estilo);document.querySelectorAll('.voz-opcion').forEach(el=>{el.classList.toggle('activo',el.dataset.voz===estilo);});}

function hablar(texto){if(!synth)return;if(synth.speaking)synth.cancel();if(vocesDisponibles.length===0)cargarVoces();let utterance=new SpeechSynthesisUtterance(texto);utterance.lang='es-ES';utterance.rate=0.9;utterance.pitch=1.0;if(vozActual==='grave'){utterance.pitch=0.8;utterance.rate=0.85;}else if(vozActual==='aguda'){utterance.pitch=1.2;utterance.rate=1.0;}else if(vozActual==='calma'){utterance.rate=0.7;utterance.pitch=1.0;}else if(vozActual==='motivador'){utterance.rate=1.0;utterance.pitch=1.1;}else if(vozActual==='sabia'){utterance.rate=0.75;utterance.pitch=0.9;}if(vozSeleccionada)utterance.voice=vozSeleccionada;utterance.lang='es-ES';synth.speak(utterance);}

if(synth){vozActual=localStorage.getItem('bola8_voz_estilo')||'auto';cargarVoces();synth.onvoiceschanged=function(){cargarVoces();};setTimeout(()=>{if(vocesDisponibles.length===0)cargarVoces();},500);}

// EFECTOS
function lanzarParticulas(){const scene=document.getElementById('scene');const rect=scene.getBoundingClientRect();const centroX=rect.left+rect.width/2;const centroY=rect.top+rect.height/2;for(let i=1;i<=3;i++){const particula=document.createElement('div');particula.className='particula p'+i;particula.style.left=centroX+'px';particula.style.top=centroY+'px';document.body.appendChild(particula);setTimeout(()=>{particula.remove();},800);}}
function agitarBola(){const bola=document.getElementById('bola');bola.classList.add('shaking');lanzarParticulas();setTimeout(()=>{bola.classList.remove('shaking');},800);}

// UI
const bola=document.getElementById('bola');const sceneEl=document.getElementById('scene');const caraBack=document.getElementById('caraBack');const chatTexto=document.getElementById('chatTexto');const shapeElement=document.getElementById('shapeElement');const reproducirBtn=document.getElementById('reproducirBtn');const preguntarBtn=document.getElementById('preguntarBtn');const microBtn=document.getElementById('microBtn');const statsBtn=document.getElementById('statsBtn');const statsCerrar=document.getElementById('statsCerrar');const btnModo=document.getElementById('btnModo');const modoPanel=document.getElementById('modoPanel');const btnVoz=document.getElementById('btnVoz');const vozPanel=document.getElementById('vozPanel');

function girarBola(){bola.style.transform='rotateY(180deg)';girada=true;if(timeoutTransform)clearTimeout(timeoutTransform);timeoutTransform=setTimeout(()=>{if(girada)shapeElement.classList.add('cuadrado');},1500);}
function regresarBola(){bola.style.transform='rotateY(0deg)';girada=false;if(timeoutTransform)clearTimeout(timeoutTransform);shapeElement.classList.remove('cuadrado');}
function toggleBola(){girada?regresarBola():girarBola();}
setTimeout(()=>{bola.style.animation='none';bola.style.transform='rotateY(0deg)';},1000);

function mostrarRespuesta(respuesta,pregunta,leer=true){chatTexto.innerText=respuesta;ultimaRespuesta=respuesta;registrarInteraccion(pregunta,respuesta,obtenerCategoriaDeCita(respuesta));if(leer){setTimeout(()=>hablar(respuesta),500);}}

function procesarPregunta(texto,leer=true){if(!texto||!texto.trim()){let r=respuestasSurrealistas[Math.floor(Math.random()*respuestasSurrealistas.length)];mostrarRespuesta(r,"[pregunta vacía]",leer);if(!girada)girarBola();agitarBola();return;}let respuesta=obtenerCitaPorContexto(texto);mostrarRespuesta(respuesta,texto,leer);if(!girada)girarBola();agitarBola();}

function respuestaAleatoria(){let r=modoActivo.citas.sabiduria[Math.floor(Math.random()*modoActivo.citas.sabiduria.length)];mostrarRespuesta(r,"[aleatorio]",true);if(!girada)girarBola();agitarBola();}

function leerTextoActual(){if(ultimaRespuesta)hablar(ultimaRespuesta);else if(chatTexto.innerText&&chatTexto.innerText.trim())hablar(chatTexto.innerText);else{let s="ESCRIBE UNA PREGUNTA PRIMERO";chatTexto.innerText=s;hablar(s);}}

function iniciarMicrofono(){if(!('webkitSpeechRecognition'in window)){chatTexto.innerText="❌ VOZ NO SOPORTADA EN ESTE NAVEGADOR";return;}const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;reconocimiento=new SpeechRecognition();reconocimiento.lang='es-ES';reconocimiento.onstart=()=>{grabando=true;microBtn.classList.add('grabando');chatTexto.innerText="🎤 ESCUCHANDO...";};reconocimiento.onresult=(e)=>{let texto=e.results[0][0].transcript;chatTexto.innerText=texto;procesarPregunta(texto,true);detenerMicrofono();};reconocimiento.onerror=()=>detenerMicrofono();reconocimiento.onend=()=>detenerMicrofono();reconocimiento.start();}
function detenerMicrofono(){if(reconocimiento)try{reconocimiento.stop();}catch(e){}grabando=false;microBtn.classList.remove('grabando');if(chatTexto.innerText==="🎤 ESCUCHANDO...")chatTexto.innerText="";}
function toggleMicrofono(){grabando?detenerMicrofono():iniciarMicrofono();}

function iniciarDeteccionMovimiento(){if(window.DeviceMotionEvent){window.addEventListener('devicemotion',(e)=>{let ahora=Date.now();if(ahora-ultimoAgite<800)return;let acc=e.accelerationIncludingGravity;if(!acc)return;let fuerza=Math.abs((acc.x||0)-ultimaX)+Math.abs((acc.y||0)-ultimaY)+Math.abs((acc.z||0)-ultimaZ);if(fuerza>25){ultimoAgite=ahora;respuestaAleatoria();}ultimaX=acc.x||0;ultimaY=acc.y||0;ultimaZ=acc.z||0;});}}
function solicitarPermisoMovimiento(){if(typeof DeviceMotionEvent.requestPermission==='function'){DeviceMotionEvent.requestPermission().then(r=>{if(r==='granted')iniciarDeteccionMovimiento();});}else iniciarDeteccionMovimiento();}

sceneEl.addEventListener('click',(e)=>{if(e.target===reproducirBtn||e.target===preguntarBtn||e.target===microBtn||reproducirBtn.contains(e.target)||preguntarBtn.contains(e.target)||microBtn.contains(e.target))return;if(e.target===caraBack||caraBack.contains(e.target)){if(girada)chatTexto.focus();}else{toggleBola();}});
preguntarBtn.addEventListener('click',()=>procesarPregunta(chatTexto.innerText,true));
microBtn.addEventListener('click',toggleMicrofono);
reproducirBtn.addEventListener('click',leerTextoActual);
statsBtn.addEventListener('click',toggleStats);
statsCerrar.addEventListener('click',toggleStats);
btnModo.addEventListener('click',(e)=>{e.stopPropagation();modoPanel.classList.toggle('visible');vozPanel.classList.remove('visible');});
document.querySelectorAll('.modo-opcion').forEach(btn=>{btn.addEventListener('click',()=>cambiarModo(btn.dataset.modo));});
btnVoz.addEventListener('click',(e)=>{e.stopPropagation();vozPanel.classList.toggle('visible');modoPanel.classList.remove('visible');});
document.querySelectorAll('.voz-opcion').forEach(btn=>{btn.addEventListener('click',()=>{seleccionarVozPorEstilo(btn.dataset.voz);vozPanel.classList.remove('visible');});});
document.body.addEventListener('click',(e)=>{if(!btnModo.contains(e.target)&&!modoPanel.contains(e.target))modoPanel.classList.remove('visible');if(!btnVoz.contains(e.target)&&!vozPanel.contains(e.target))vozPanel.classList.remove('visible');});

if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'){let btn=document.createElement('div');btn.innerText='🎯 ACTIVAR AGITADO';btn.style.cssText='position:fixed;bottom:55px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#ccf;padding:6px 12px;border-radius:30px;font-size:0.65rem;z-index:100;cursor:pointer;border:1px solid #3a5a7a';btn.onclick=solicitarPermisoMovimiento;document.body.appendChild(btn);}else if(window.DeviceMotionEvent)iniciarDeteccionMovimiento();

chatTexto.innerText="ESCRIBE TU PREGUNTA...";
setTimeout(()=>{if(chatTexto.innerText==="ESCRIBE TU PREGUNTA...")chatTexto.innerText="";},2500);
</script>
</body>
</html>
