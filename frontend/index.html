<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🎱 Bola Mágica 8 - Esfera 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #1a1a2e, #0a0a0a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Contenedor principal */
        .container {
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            perspective: 1200px;
        }

        /* Escena 3D */
        .scene {
            width: 320px;
            height: 320px;
            position: relative;
            cursor: pointer;
        }

        /* Esfera que rota */
        .sphere {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateIn 1.5s ease-out;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 50%;
        }

        /* Animación de entrada: giro completo de presentación */
        @keyframes rotateIn {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            100% { transform: rotateY(360deg) rotateX(15deg); }
        }

        /* Cada cara de la esfera */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 -20px 30px rgba(0,0,0,0.5), inset 0 20px 25px rgba(255,255,255,0.1), 0 15px 25px rgba(0,0,0,0.4);
        }

        /* Cara frontal: número 8 clásico */
        .face.front {
            background: radial-gradient(circle at 35% 35%, #222, #050505);
            transform: rotateY(0deg);
        }

        .number-8 {
            width: 130px;
            height: 130px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4), inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .number-8 span {
            font-size: 5.5rem;
            font-weight: 900;
            color: #111;
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        /* Cara trasera: todo el triángulo invertido con la interfaz completa */
        .face.back {
            background: radial-gradient(circle at 35% 35%, #1a2a2a, #0a0a1a);
            transform: rotateY(180deg);
            flex-direction: column;
            padding: 20px;
        }

        /* Triángulo invertido (dos vértices arriba, punta abajo) */
        .triangle-interface {
            width: 100%;
            background: linear-gradient(145deg, #0a1a2a, #051015);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            padding: 50px 20px 35px 20px;
            text-align: center;
            border: 1px solid rgba(80, 180, 255, 0.4);
            box-shadow: inset 0 0 20px rgba(0, 100, 200, 0.2), 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Respuesta dentro del triángulo */
        .respuesta-area {
            min-height: 90px;
            margin-bottom: 20px;
        }

        .frase {
            color: #cceeff;
            font-size: 0.9rem;
            line-height: 1.4;
            font-style: italic;
            text-shadow: 0 0 5px rgba(100, 200, 255, 0.3);
            font-weight: 500;
        }

        .autor {
            color: #8ab3cc;
            font-size: 0.7rem;
            margin-top: 8px;
            border-top: 1px solid rgba(80, 180, 255, 0.3);
            padding-top: 6px;
        }

        /* Campo de escritura dentro del triángulo */
        .input-triangle {
            width: 100%;
            margin-top: 10px;
        }

        .input-triangle input {
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            border: none;
            background: rgba(30, 50, 70, 0.9);
            color: #fff;
            font-size: 0.85rem;
            text-align: center;
            outline: none;
            font-family: inherit;
        }

        .input-triangle input::placeholder {
            color: #8ab3cc;
            font-style: italic;
        }

        /* Botones dentro del triángulo */
        .buttons-triangle {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-triangle {
            background: #2a4a6a;
            border: none;
            color: #cceeff;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-triangle:active {
            transform: scale(0.96);
        }

        .micro-btn {
            background: #3a5a7a;
        }

        .micro-btn.grabando {
            background: #a33;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* Filtros dentro del triángulo (zona pequeña) */
        .filtros-triangle {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .filtro-chip {
            background: #1a3a4a;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            color: #aaf;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            border: 1px solid #4af;
        }

        .filtro-chip .remove {
            color: #f66;
            font-weight: bold;
            cursor: pointer;
        }

        .sugerencia-chip {
            background: #2a3a4a;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            color: #ccf;
            cursor: pointer;
            border: 1px solid #6cf;
        }

        /* Mensaje de estado */
        .estado {
            font-size: 0.6rem;
            color: #8ab3cc;
            margin-top: 12px;
            text-align: center;
        }

        /* Instrucción de agitado */
        .shake-info {
            text-align: center;
            font-size: 0.6rem;
            color: #668;
            margin-top: 15px;
        }

        /* Botón flotante para girar (opcional) */
        .rotate-hint {
            text-align: center;
            font-size: 0.6rem;
            color: #668;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="scene" id="scene">
        <div class="sphere" id="sphere">
            <!-- Cara frontal: número 8 -->
            <div class="face front">
                <div class="number-8">
                    <span>8</span>
                </div>
            </div>
            <!-- Cara trasera: triángulo invertido con toda la interfaz -->
            <div class="face back">
                <div class="triangle-interface">
                    <div class="respuesta-area">
                        <div class="frase" id="frase">🎱 Haz una pregunta...</div>
                        <div class="autor" id="autor">— Bola Mágica 8</div>
                    </div>
                    <div class="input-triangle">
                        <input type="text" id="preguntaInput" placeholder="Escribe tu pregunta..." autocomplete="off">
                    </div>
                    <div class="buttons-triangle">
                        <button class="btn-triangle" id="preguntarBtn">🔮 Preguntar</button>
                        <button class="btn-triangle micro-btn" id="microBtn">🎤 Hablar</button>
                    </div>
                    <div class="filtros-triangle" id="filtrosContainer"></div>
                    <div class="estado" id="estadoMsg"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="shake-info" id="shakeInfo">📱 Toca la bola para girarla | Agita para respuesta aleatoria</div>
<div class="rotate-hint" id="rotateHint"></div>

<script>
    // ============================================================
    // BASE DE DATOS DE FRASES
    // ============================================================
    const frasesPorTema = {
        amor: ["«Amar es encontrar en la felicidad de otro tu propia felicidad.» — Leibniz","«El amor no se mira, se siente.» — Sabina","«Te quiero no por quien eres, sino por quien soy cuando estoy contigo.» — García Márquez"],
        trabajo: ["«Elige un trabajo que te guste y no trabajarás ni un día.» — Confucio","«El 90% del éxito es presentarse.» — Woody Allen","«La única manera de hacer un gran trabajo es amar lo que haces.» — Steve Jobs"],
        futuro: ["«El futuro pertenece a los que creen en sus sueños.» — Eleanor Roosevelt","«El mejor modo de predecir el futuro es creándolo.» — Peter Drucker","«El futuro no está escrito, somos nosotros quienes lo creamos.»"],
        dinero: ["«El dinero no trae la felicidad, pero la compra.»","«No es rico el que más tiene, sino el que menos necesita.»","«Gana dinero mientras duermes, o trabajarás hasta que te mueras.» — Buffett"],
        familia: ["«La familia no es cuestión de sangre, sino de respeto y alegría.» — Bach","«La familia te quiere sin preguntar.»","«La familia es donde aprendemos a amar.» — Papa Francisco"],
        amigos: ["«Un amigo es quien lo sabe todo de ti y aún así te quiere.» — Hubbard","«Los amigos son la familia que eliges.» — Scott","«La amistad duplica las alegrías y divide las angustias.» — Bacon"],
        exito: ["«El éxito no es la clave de la felicidad. La felicidad es la clave del éxito.» — Schweitzer","«El éxito es ir de fracaso en fracaso sin desesperarse.» — Churchill","«El éxito es obtener lo que deseas; la felicidad, disfrutarlo.» — Emerson"],
        vida: ["«La vida es lo que pasa mientras haces otros planes.» — John Lennon","«La vida es como una bicicleta: para mantener el equilibrio, sigue adelante.» — Einstein","«Vive como si fueras a morir mañana, aprende como si fueras a vivir siempre.» — Gandhi"]
    };
    const frasesGenerales = ["«La sabiduría comienza en la reflexión.» — Sócrates","«Solo sé que no sé nada.» — Sócrates","«Pienso, luego existo.» — Descartes","«El sentido común es el menos común de los sentidos.» — Voltaire"];

    let filtrosActivos = [];
    let reconocimiento = null;
    let grabando = false;
    let girada = false;
    let ultimoAgite = 0;
    let ultimaX = 0, ultimaY = 0, ultimaZ = 0;

    // Elementos DOM
    const sphere = document.getElementById('sphere');
    const scene = document.getElementById('scene');
    const fraseDiv = document.getElementById('frase');
    const autorDiv = document.getElementById('autor');
    const preguntaInput = document.getElementById('preguntaInput');
    const preguntarBtn = document.getElementById('preguntarBtn');
    const microBtn = document.getElementById('microBtn');
    const filtrosContainer = document.getElementById('filtrosContainer');
    const estadoMsg = document.getElementById('estadoMsg');
    const shakeInfo = document.getElementById('shakeInfo');

    // ============================================================
    // FUNCIONES DE LA BOLA 3D
    // ============================================================
    function girarBola() {
        sphere.style.transform = 'rotateY(180deg) rotateX(0deg)';
        girada = true;
    }

    function regresarBola() {
        sphere.style.transform = 'rotateY(0deg) rotateX(0deg)';
        girada = false;
    }

    function toggleBola() {
        if (girada) regresarBola();
        else girarBola();
    }

    // Al cargar, la bola ya hizo la animación rotateIn, la dejamos en posición frontal
    setTimeout(() => {
        sphere.style.animation = 'none';
        sphere.style.transform = 'rotateY(0deg) rotateX(0deg)';
    }, 1500);

    // ============================================================
    // LÓGICA DE RESPUESTAS
    // ============================================================
    function obtenerRespuesta() {
        let pool = [];
        for (let tema of filtrosActivos) {
            if (frasesPorTema[tema]) pool.push(...frasesPorTema[tema]);
        }
        if (pool.length === 0) pool = frasesGenerales;
        return pool[Math.floor(Math.random() * pool.length)];
    }

    function mostrarRespuesta(respuesta) {
        const partes = respuesta.split(' — ');
        fraseDiv.innerHTML = partes[0];
        autorDiv.innerHTML = '— ' + (partes[1] || 'Bola Mágica 8');
        estadoMsg.innerHTML = '✨ Respuesta de la bola ✨';
        setTimeout(() => { if (estadoMsg.innerHTML === '✨ Respuesta de la bola ✨') estadoMsg.innerHTML = ''; }, 2000);
    }

    function procesarPregunta(texto) {
        if (!texto.trim()) {
            estadoMsg.innerHTML = '❓ Escribe una pregunta primero';
            setTimeout(() => { if (estadoMsg.innerHTML === '❓ Escribe una pregunta primero') estadoMsg.innerHTML = ''; }, 1500);
            return;
        }
        const respuesta = obtenerRespuesta();
        mostrarRespuesta(respuesta);
        preguntaInput.value = '';
        // Gira la bola para mostrar la respuesta
        if (!girada) girarBola();
        // Vuelve a la cara del 8 después de 3 segundos
        setTimeout(() => regresarBola(), 3500);
    }

    function respuestaAleatoria() {
        const respuesta = obtenerRespuesta();
        mostrarRespuesta(respuesta);
        if (!girada) girarBola();
        setTimeout(() => regresarBola(), 3500);
    }

    // ============================================================
    // FILTROS (temas)
    // ============================================================
    function actualizarUI_Filtros() {
        filtrosContainer.innerHTML = '';
        const todosTemas = ['amor', 'trabajo', 'futuro', 'dinero', 'familia', 'amigos', 'exito', 'vida'];
        const nombres = {amor:'💕 Amor', trabajo:'💼 Trabajo', futuro:'🔮 Futuro', dinero:'💰 Dinero', familia:'👪 Familia', amigos:'👥 Amigos', exito:'🏆 Éxito', vida:'🌿 Vida'};

        // Mostrar filtros activos (con X para eliminar)
        for (let tema of filtrosActivos) {
            const chip = document.createElement('span');
            chip.className = 'filtro-chip';
            chip.innerHTML = `${nombres[tema]} <span class="remove" data-tema="${tema}">✕</span>`;
            filtrosContainer.appendChild(chip);
        }

        // Mostrar sugerencias de temas no activos
        for (let tema of todosTemas) {
            if (!filtrosActivos.includes(tema)) {
                const sugerencia = document.createElement('span');
                sugerencia.className = 'sugerencia-chip';
                sugerencia.innerHTML = nombres[tema];
                sugerencia.onclick = () => {
                    if (!filtrosActivos.includes(tema)) {
                        filtrosActivos.push(tema);
                        actualizarUI_Filtros();
                        estadoMsg.innerHTML = `✅ Añadido tema: ${nombres[tema]}`;
                        setTimeout(() => { if (estadoMsg.innerHTML === `✅ Añadido tema: ${nombres[tema]}`) estadoMsg.innerHTML = ''; }, 1500);
                    }
                };
                filtrosContainer.appendChild(sugerencia);
            }
        }

        // Eventos para eliminar filtros
        document.querySelectorAll('.remove').forEach(el => {
            el.addEventListener('click', (e) => {
                const tema = el.dataset.tema;
                filtrosActivos = filtrosActivos.filter(t => t !== tema);
                actualizarUI_Filtros();
                estadoMsg.innerHTML = `🗑️ Eliminado tema: ${nombres[tema]}`;
                setTimeout(() => { if (estadoMsg.innerHTML === `🗑️ Eliminado tema: ${nombres[tema]}`) estadoMsg.innerHTML = ''; }, 1500);
                e.stopPropagation();
            });
        });
    }

    // ============================================================
    // MICRÓFONO
    // ============================================================
    function iniciarMicrofono() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            estadoMsg.innerHTML = '❌ Tu navegador no soporta voz';
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        reconocimiento = new SpeechRecognition();
        reconocimiento.lang = 'es-ES';
        reconocimiento.continuous = false;
        reconocimiento.interimResults = false;
        reconocimiento.onstart = () => {
            grabando = true;
            microBtn.classList.add('grabando');
            microBtn.textContent = '🔴 Grabando...';
            estadoMsg.innerHTML = '🎤 Escuchando... habla ahora';
        };
        reconocimiento.onresult = (event) => {
            const texto = event.results[0][0].transcript;
            preguntaInput.value = texto;
            procesarPregunta(texto);
            detenerMicrofono();
        };
        reconocimiento.onerror = () => {
            estadoMsg.innerHTML = '❌ Error de micrófono';
            detenerMicrofono();
        };
        reconocimiento.onend = () => detenerMicrofono();
        reconocimiento.start();
    }

    function detenerMicrofono() {
        if (reconocimiento) try { reconocimiento.stop(); } catch(e) {}
        grabando = false;
        microBtn.classList.remove('grabando');
        microBtn.textContent = '🎤 Hablar';
        if (estadoMsg.innerHTML === '🎤 Escuchando... habla ahora') estadoMsg.innerHTML = '';
    }

    function toggleMicrofono() {
        if (grabando) detenerMicrofono();
        else iniciarMicrofono();
    }

    // ============================================================
    // MOVIMIENTO (AGITADO)
    // ============================================================
    function iniciarDeteccionMovimiento() {
        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', (e) => {
                const ahora = Date.now();
                if (ahora - ultimoAgite < 800) return;
                const acc = e.accelerationIncludingGravity;
                if (!acc) return;
                const x = acc.x || 0, y = acc.y || 0, z = acc.z || 0;
                const fuerza = Math.abs(x - ultimaX) + Math.abs(y - ultimaY) + Math.abs(z - ultimaZ);
                if (fuerza > 25) {
                    ultimoAgite = ahora;
                    respuestaAleatoria();
                }
                ultimaX = x; ultimaY = y; ultimaZ = z;
            });
            shakeInfo.innerHTML = '📱 ¡Agitado activado! Agita la bola para respuesta aleatoria';
        }
    }

    function solicitarPermisoMovimiento() {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') iniciarDeteccionMovimiento();
                    else shakeInfo.innerHTML = '📱 Permiso denegado para agitado';
                })
                .catch(() => shakeInfo.innerHTML = '📱 Error al pedir permiso');
        } else iniciarDeteccionMovimiento();
    }

    // ============================================================
    // EVENTOS Y ARRANQUE
    // ============================================================
    scene.addEventListener('click', toggleBola);
    preguntarBtn.addEventListener('click', () => procesarPregunta(preguntaInput.value));
    preguntaInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') procesarPregunta(preguntaInput.value); });
    microBtn.addEventListener('click', toggleMicrofono);

    // Permiso de agitado en iOS
    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
        shakeInfo.innerHTML = '📱 Toca "Activar agitado" para usar el giroscopio';
        const activador = document.createElement('div');
        activador.style.background = '#2a4a6a';
        activador.style.color = '#ccf';
        activador.style.padding = '6px 12px';
        activador.style.borderRadius = '30px';
        activador.style.fontSize = '0.7rem';
        activador.style.marginTop = '10px';
        activador.style.textAlign = 'center';
        activador.style.cursor = 'pointer';
        activador.innerText = '🎯 Activar agitado (iOS)';
        activador.onclick = solicitarPermisoMovimiento;
        document.body.appendChild(activador);
    } else if (window.DeviceMotionEvent) {
        iniciarDeteccionMovimiento();
    } else {
        shakeInfo.innerHTML = '🔮 Tu dispositivo no soporta agitado. Usa el botón.';
    }

    actualizarUI_Filtros();
    estadoMsg.innerHTML = '🎱 Bola Mágica 8 lista. Toca la bola para girar.';
    setTimeout(() => { if (estadoMsg.innerHTML === '🎱 Bola Mágica 8 lista. Toca la bola para girar.') estadoMsg.innerHTML = ''; }, 3000);
</script>
</body>
</html>
