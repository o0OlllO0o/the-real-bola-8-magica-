<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#111111">
    <title>🎱 Bola Mágica 8 - Con Memoria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #1a1a2e, #050510);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            padding: 16px;
        }

        .container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .scene {
            width: min(85vw, 85vh, 420px);
            height: min(85vw, 85vh, 420px);
            position: relative;
            cursor: pointer;
        }

        .bola {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 50%;
            animation: rotateIn 1s ease-out;
        }

        @keyframes rotateIn {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .cara {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 -25px 35px rgba(0,0,0,0.5), inset 0 25px 30px rgba(255,255,255,0.1), 0 20px 30px rgba(0,0,0,0.4);
        }

        .cara.front {
            background: radial-gradient(circle at 35% 35%, #2a2a2a, #080808);
            transform: rotateY(0deg);
        }

        .numero-8 {
            width: 45%;
            height: 45%;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .numero-8 span {
            font-size: clamp(2.5rem, 12vw, 5rem);
            font-weight: 900;
            color: #111;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        .cara.back {
            background: radial-gradient(circle at 35% 35%, #1a2a2a, #0a0a1a);
            transform: rotateY(180deg);
            padding: 8%;
            pointer-events: auto;
        }

        .triangulo {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #0a1a2a, #051015);
            clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15% 10% 20% 10%;
            border: 1px solid rgba(80, 180, 255, 0.4);
            box-shadow: inset 0 0 25px rgba(0, 80, 160, 0.2), 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .chat-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .texto-unificado {
            width: 100%;
            background: rgba(10, 25, 35, 0.9);
            border: 1px solid rgba(80, 180, 255, 0.5);
            border-radius: 20px;
            padding: 14px 12px;
            color: #d4eaff;
            font-size: clamp(0.7rem, 3.5vw, 0.9rem);
            font-family: inherit;
            text-align: center;
            resize: none;
            outline: none;
            backdrop-filter: blur(4px);
            word-break: break-word;
            min-height: 100px;
            max-height: 160px;
            overflow-y: auto;
        }

        .botones-triangulo {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: #2a4a6a;
            border: none;
            color: #cceeff;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: clamp(0.6rem, 2.8vw, 0.7rem);
            cursor: pointer;
            font-weight: bold;
        }

        .micro-btn.grabando { background: #a33; animation: pulse 1s infinite; }
        .speaker-btn { background: #4a6a8a; }
        .stats-btn { background: #3a5a3a; }

        @keyframes pulse { 0% { opacity: 0.7; } 100% { opacity: 1; } }

        /* Panel de estadísticas */
        .stats-panel {
            position: fixed;
            bottom: 60px;
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 12px;
            margin: 10px;
            border: 1px solid #4af;
            z-index: 150;
            transform: translateY(calc(100% + 10px));
            transition: transform 0.3s ease;
            max-height: 70vh;
            overflow-y: auto;
        }
        .stats-panel.visible { transform: translateY(0); }
        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #ccf;
            border-bottom: 1px solid #4af;
            padding-bottom: 8px;
        }
        .stats-cerrar {
            background: none;
            border: none;
            color: #f88;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .stats-lista {
            font-size: 0.7rem;
            color: #aaf;
            max-height: 200px;
            overflow-y: auto;
        }
        .stats-item {
            padding: 5px;
            border-bottom: 1px solid #2a4a6a;
            font-family: monospace;
        }
        .stats-resumen {
            margin-bottom: 10px;
            padding: 8px;
            background: #1a3a4a;
            border-radius: 12px;
            font-size: 0.7rem;
        }

        .info-externa {
            position: fixed;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.6rem;
            color: #668;
            background: rgba(0,0,0,0.5);
            padding: 6px;
            backdrop-filter: blur(4px);
            z-index: 100;
        }

        .brillo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent 70%);
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="scene" id="scene">
        <div class="bola" id="bola">
            <div class="cara front">
                <div class="numero-8"><span>8</span></div>
                <div class="brillo"></div>
            </div>
            <div class="cara back" id="caraBack">
                <div class="triangulo" id="triangulo">
                    <div class="chat-area">
                        <div class="texto-unificado" id="chatTexto" contenteditable="true" role="textbox" aria-multiline="true"></div>
                        <div class="botones-triangulo">
                            <button class="btn" id="preguntarBtn">🔮 Preguntar</button>
                            <button class="btn micro-btn" id="microBtn">🎤 Hablar</button>
                            <button class="btn speaker-btn" id="speakerBtn">🔊 Leer</button>
                            <button class="btn stats-btn" id="statsBtn">📊 Stats</button>
                        </div>
                    </div>
                </div>
                <div class="brillo"></div>
            </div>
        </div>
    </div>
</div>
<div class="info-externa" id="infoExterna">📱 Toca la bola (lado 8) para girar | 🔊 Lee respuestas | 📊 Estadísticas de sesión</div>

<!-- Panel de estadísticas -->
<div class="stats-panel" id="statsPanel">
    <div class="stats-header">
        <span>📊 Estadísticas de tu sesión</span>
        <button class="stats-cerrar" id="statsCerrar">✕</button>
    </div>
    <div class="stats-resumen" id="statsResumen"></div>
    <div class="stats-lista" id="statsLista"></div>
</div>

<script>
    // ============================================================
    // BASE DE DATOS DE FRASES
    // ============================================================
    const frasesNormales = {
        amor: ["«Amar es encontrar en la felicidad de otro tu propia felicidad.» — Leibniz","«El amor no se mira, se siente.» — Sabina","«Te quiero no por quien eres, sino por quien soy cuando estoy contigo.» — García Márquez","«El amor es una locura que solo cura el amor.» — Lope de Vega","«Amar es desear lo que se tiene.» — San Agustín"],
        trabajo: ["«Elige un trabajo que te guste y no trabajarás ni un día.» — Confucio","«El 90% del éxito es presentarse.» — Woody Allen","«La única manera de hacer un gran trabajo es amar lo que haces.» — Steve Jobs","«El trabajo dignifica, pero el descanso también.»","«No trabajes por dinero, haz que el dinero trabaje para ti.» — Kiyosaki"],
        futuro: ["«El futuro pertenece a los que creen en sus sueños.» — Eleanor Roosevelt","«El mejor modo de predecir el futuro es creándolo.» — Peter Drucker","«El futuro no está escrito, somos nosotros quienes lo creamos.»","«El futuro tiene muchos nombres: para los débiles es lo inalcanzable; para los temerosos, lo desconocido; para los valientes, la oportunidad.» — Victor Hugo"],
        dinero: ["«El dinero no trae la felicidad, pero la compra.»","«No es rico el que más tiene, sino el que menos necesita.»","«Gana dinero mientras duermes, o trabajarás hasta que te mueras.» — Buffett","«El dinero es un buen sirviente pero un mal amo.» — Bacon"],
        familia: ["«La familia no es cuestión de sangre, sino de respeto y alegría.» — Bach","«La familia te quiere sin preguntar.»","«La familia es donde aprendemos a amar.» — Papa Francisco"],
        amigos: ["«Un amigo es quien lo sabe todo de ti y aún así te quiere.» — Hubbard","«Los amigos son la familia que eliges.» — Scott","«La amistad duplica las alegrías y divide las angustias.» — Bacon"],
        exito: ["«El éxito no es la clave de la felicidad. La felicidad es la clave del éxito.» — Schweitzer","«El éxito es ir de fracaso en fracaso sin desesperarse.» — Churchill","«El éxito es obtener lo que deseas; la felicidad, disfrutarlo.» — Emerson"],
        vida: ["«La vida es lo que pasa mientras haces otros planes.» — John Lennon","«La vida es como una bicicleta: para mantener el equilibrio, sigue adelante.» — Einstein","«Vive como si fueras a morir mañana, aprende como si fueras a vivir siempre.» — Gandhi"]
    };

    const frasesExtranas = [
        "«Los pingüinos usan esmoquin porque no tienen armario para chaquetas.» — Anónimo",
        "«Si un libro se aburre, cámbiale la pila.» — Alicia",
        "«El tiempo vuela como un coche sin ruedas.» — Proverbio marciano",
        "«La Luna es un queso que nunca se acaba porque los ratones son astronautas.» — Teoría galáctica",
        "«Las nubes no lloran, sudan emociones.» — Meteoro loco",
        "«El silencio tiene eco si gritas muy fuerte hacia adentro.» — Poeta invisible",
        "«Los árboles bailan cumbia cuando nadie mira.» — Botánica imaginaria",
        "«El agua hierve al revés en el país de los espejos.» — Alicia vuelve",
        "«Un tren puede silbar una canción de cuna si le cantas primero.» — Maquinista onírico",
        "«El arcoíris es solo el bigote del sol.» — Astronomía disparatada",
        "«Los calcetines desaparecen porque viajan al futuro a buscarse a sí mismos.» — Teoría del caos textil"
    ];

    const frasesGenerales = ["«La sabiduría comienza en la reflexión.» — Sócrates","«Solo sé que no sé nada.» — Sócrates","«Pienso, luego existo.» — Descartes","«El sentido común es el menos común de los sentidos.» — Voltaire"];

    // ============================================================
    // SISTEMA DE LOG Y MEMORIA (localStorage)
    // ============================================================
    let sesionId = localStorage.getItem('bola8_sesion_id');
    if (!sesionId) {
        sesionId = 'sesion_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        localStorage.setItem('bola8_sesion_id', sesionId);
    }

    // Cargar o crear historial
    let historial = JSON.parse(localStorage.getItem('bola8_historial_' + sesionId)) || [];
    let frasesUsadas = new Set(historial.map(h => h.respuesta));
    
    // Contador de frases por categoría
    let contadorCategorias = JSON.parse(localStorage.getItem('bola8_categorias_' + sesionId)) || {};

    function guardarHistorial() {
        localStorage.setItem('bola8_historial_' + sesionId, JSON.stringify(historial));
        localStorage.setItem('bola8_categorias_' + sesionId, JSON.stringify(contadorCategorias));
    }

    function registrarInteraccion(pregunta, respuesta, categoria = 'general') {
        historial.unshift({
            timestamp: new Date().toISOString(),
            pregunta: pregunta,
            respuesta: respuesta,
            categoria: categoria
        });
        // Mantener solo últimas 50 interacciones
        if (historial.length > 50) historial.pop();
        
        frasesUsadas.add(respuesta);
        contadorCategorias[categoria] = (contadorCategorias[categoria] || 0) + 1;
        
        guardarHistorial();
        actualizarStatsUI();
    }

    // Obtener respuesta sin repetir recientes (evitar repetir en las últimas 5)
    function obtenerRespuestaSinRepetir(pool, evitarRepetir = true) {
        if (!evitarRepetir || pool.length === 0) return pool[Math.floor(Math.random() * pool.length)];
        
        // Filtrar frases no usadas recientemente (últimas 5)
        let candidatas = pool.filter(f => !frasesUsadas.has(f));
        if (candidatas.length === 0) candidatas = pool; // Si todas están usadas, reiniciar
        
        const elegida = candidatas[Math.floor(Math.random() * candidatas.length)];
        return elegida;
    }

    function obtenerRespuestaNormal() {
        let pool = [];
        for (let tema of temasActivos) {
            if (frasesNormales[tema]) pool.push(...frasesNormales[tema]);
        }
        if (pool.length === 0) pool = frasesGenerales;
        return obtenerRespuestaSinRepetir(pool, true);
    }

    function obtenerRespuestaExtrana() {
        return obtenerRespuestaSinRepetir(frasesExtranas, true);
    }

    function obtenerCategoriaDeRespuesta(respuesta) {
        for (let [cat, frases] of Object.entries(frasesNormales)) {
            if (frases.includes(respuesta)) return cat;
        }
        if (frasesExtranas.includes(respuesta)) return 'extrana';
        return 'general';
    }

    // ============================================================
    // UI DE ESTADÍSTICAS
    // ============================================================
    function actualizarStatsUI() {
        const statsResumen = document.getElementById('statsResumen');
        const statsLista = document.getElementById('statsLista');
        
        const totalPreguntas = historial.length;
        const frasesUnicas = frasesUsadas.size;
        
        statsResumen.innerHTML = `
            <strong>📊 Resumen de sesión</strong><br>
            🎱 Preguntas realizadas: ${totalPreguntas}<br>
            💬 Frases únicas dichas: ${frasesUnicas}<br>
            📁 Sesión ID: ${sesionId.substr(0, 16)}...<br>
        `;
        
        if (totalPreguntas > 0) {
            statsLista.innerHTML = '<strong>📜 Últimas preguntas:</strong><br>';
            historial.slice(0, 10).forEach((item, idx) => {
                const fecha = new Date(item.timestamp).toLocaleTimeString();
                statsLista.innerHTML += `
                    <div class="stats-item">
                        ${idx+1}. [${fecha}] "${item.pregunta.substring(0, 40)}..."<br>
                        → ${item.respuesta.substring(0, 60)}...
                    </div>
                `;
            });
        } else {
            statsLista.innerHTML = 'Aún no hay interacciones. ¡Haz una pregunta!';
        }
    }

    function toggleStats() {
        const panel = document.getElementById('statsPanel');
        panel.classList.toggle('visible');
        actualizarStatsUI();
    }

    // ============================================================
    // RESTO DE FUNCIONALIDAD (bola, voz, micrófono, etc.)
    // ============================================================
    let temasActivos = ['amor', 'trabajo', 'futuro', 'dinero', 'familia', 'amigos', 'exito', 'vida'];
    let reconocimiento = null;
    let grabando = false;
    let girada = false;
    let ultimoAgite = 0, ultimaX = 0, ultimaY = 0, ultimaZ = 0;
    let synth = window.speechSynthesis;
    let vozSeleccionada = null;

    function cargarVoz() {
        if (!synth) return;
        const voces = synth.getVoices();
        vozSeleccionada = voces.find(v => v.lang.startsWith('es')) || voces[0];
    }
    if (synth) {
        synth.onvoiceschanged = cargarVoz;
        cargarVoz();
    }

    function hablar(texto) {
        if (!synth) return;
        if (synth.speaking) synth.cancel();
        const utterance = new SpeechSynthesisUtterance(texto);
        if (vozSeleccionada) utterance.voice = vozSeleccionada;
        utterance.lang = 'es-ES';
        utterance.rate = 0.9;
        utterance.pitch = 0.9;
        synth.speak(utterance);
    }

    const bola = document.getElementById('bola');
    const scene = document.getElementById('scene');
    const caraBack = document.getElementById('caraBack');
    const triangulo = document.getElementById('triangulo');
    const chatTexto = document.getElementById('chatTexto');
    const preguntarBtn = document.getElementById('preguntarBtn');
    const microBtn = document.getElementById('microBtn');
    const speakerBtn = document.getElementById('speakerBtn');
    const statsBtn = document.getElementById('statsBtn');
    const statsCerrar = document.getElementById('statsCerrar');

    function girarBola() { bola.style.transform = 'rotateY(180deg)'; girada = true; }
    function regresarBola() { bola.style.transform = 'rotateY(0deg)'; girada = false; }
    function toggleBola() { girada ? regresarBola() : girarBola(); }
    function expandirChat() { if (girada) { chatTexto.focus(); } }

    setTimeout(() => { bola.style.animation = 'none'; bola.style.transform = 'rotateY(0deg)'; }, 1000);

    function mostrarRespuesta(respuesta, pregunta, leer = true) {
        chatTexto.innerText = respuesta;
        const categoria = obtenerCategoriaDeRespuesta(respuesta);
        registrarInteraccion(pregunta, respuesta, categoria);
        if (leer) hablar(respuesta);
    }

    function procesarPregunta(texto, leerRespuesta = true) {
        if (!texto || !texto.trim()) {
            const respuesta = obtenerRespuestaExtrana();
            mostrarRespuesta(respuesta, "[pregunta vacía]", leerRespuesta);
            if (!girada) girarBola();
            setTimeout(() => regresarBola(), 3500);
            return;
        }
        const respuesta = obtenerRespuestaNormal();
        mostrarRespuesta(respuesta, texto, leerRespuesta);
        if (!girada) girarBola();
        setTimeout(() => regresarBola(), 3500);
    }

    function respuestaAleatoria() {
        const esExtrana = Math.random() < 0.5;
        const respuesta = esExtrana ? obtenerRespuestaExtrana() : obtenerRespuestaNormal();
        mostrarRespuesta(respuesta, "[aleatorio: agitado]", true);
        if (!girada) girarBola();
        setTimeout(() => regresarBola(), 3500);
    }

    function leerTextoActual() {
        const texto = chatTexto.innerText;
        if (texto && texto.trim()) {
            hablar(texto);
        } else {
            const saludo = "Escribe o pregunta algo primero.";
            chatTexto.innerText = saludo;
            hablar(saludo);
        }
    }

    // Micrófono
    function iniciarMicrofono() {
        if (!('webkitSpeechRecognition' in window)) {
            chatTexto.innerText = "❌ Voz no soportada";
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        reconocimiento = new SpeechRecognition();
        reconocimiento.lang = 'es-ES';
        reconocimiento.onstart = () => {
            grabando = true;
            microBtn.classList.add('grabando');
            microBtn.textContent = '🔴...';
            chatTexto.innerText = "🎤 Escuchando...";
        };
        reconocimiento.onresult = (event) => {
            const texto = event.results[0][0].transcript;
            chatTexto.innerText = texto;
            procesarPregunta(texto, true);
            detenerMicrofono();
        };
        reconocimiento.onerror = () => { detenerMicrofono(); };
        reconocimiento.onend = () => detenerMicrofono();
        reconocimiento.start();
    }

    function detenerMicrofono() {
        if (reconocimiento) try { reconocimiento.stop(); } catch(e) {}
        grabando = false;
        microBtn.classList.remove('grabando');
        microBtn.textContent = '🎤 Hablar';
        if (chatTexto.innerText === "🎤 Escuchando...") chatTexto.innerText = "";
    }
    function toggleMicrofono() { grabando ? detenerMicrofono() : iniciarMicrofono(); }

    // Movimiento
    function iniciarDeteccionMovimiento() {
        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', (e) => {
                const ahora = Date.now();
                if (ahora - ultimoAgite < 800) return;
                const acc = e.accelerationIncludingGravity;
                if (!acc) return;
                const fuerza = Math.abs((acc.x||0)-ultimaX) + Math.abs((acc.y||0)-ultimaY) + Math.abs((acc.z||0)-ultimaZ);
                if (fuerza > 25) { ultimoAgite = ahora; respuestaAleatoria(); }
                ultimaX = acc.x||0; ultimaY = acc.y||0; ultimaZ = acc.z||0;
            });
        }
    }
    function solicitarPermisoMovimiento() {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission().then(r => { if (r === 'granted') iniciarDeteccionMovimiento(); });
        } else iniciarDeteccionMovimiento();
    }

    // Eventos
    scene.addEventListener('click', (e) => {
        if (e.target === caraBack || caraBack.contains(e.target)) {
            if (girada) expandirChat();
        } else { toggleBola(); }
    });
    preguntarBtn.addEventListener('click', () => procesarPregunta(chatTexto.innerText, true));
    microBtn.addEventListener('click', toggleMicrofono);
    speakerBtn.addEventListener('click', leerTextoActual);
    statsBtn.addEventListener('click', toggleStats);
    statsCerrar.addEventListener('click', toggleStats);
    chatTexto.focus();

    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
        const btnPermiso = document.createElement('div');
        btnPermiso.innerText = '🎯 Activar agitado';
        btnPermiso.style.cssText = 'position:fixed;bottom:55px;left:50%;transform:translateX(-50%);background:#2a4a6a;color:#ccf;padding:6px 12px;border-radius:30px;font-size:0.65rem;z-index:100;cursor:pointer';
        btnPermiso.onclick = solicitarPermisoMovimiento;
        document.body.appendChild(btnPermiso);
    } else if (window.DeviceMotionEvent) iniciarDeteccionMovimiento();

    // Mostrar estadísticas al inicio si ya hay historial
    if (historial.length > 0) {
        setTimeout(() => { toggleStats(); setTimeout(() => toggleStats(), 3000); }, 500);
    }
</script>
</body>
</html>
