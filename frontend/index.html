<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>🎱 Bola Mágica 8 - Sabiduría Ancestral</title>
    <style>#mensajeBienvenida{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-size:clamp(0.8rem,3.5vw,1.2rem);color:#fff;text-shadow:0 0 10px rgba(0,0,0,0.9);background:transparent;padding:15px;max-width:90%;z-index:10;pointer-events:none;opacity:0;transition:opacity 0.6s;}#mensajeBienvenida.visible{opacity:1;}
</style>
</head>
<body>
<div class="container">
    <div class="scene" id="scene">
        <div class="bola" id="bola"><div id="mensajeBienvenida"></div>
            <div class="cara front"><div class="numero-8"><span>8</span></div><div class="brillo"></div></div>
            <div class="cara back" id="caraBack"><div class="brillo"></div></div>
        </div>
    </div>
</div>

<div class="panel-flotante" id="panelFlotante">
    <div class="texto-multifuncional" id="chatTexto" contenteditable="true" role="textbox" aria-multiline="true"></div>
    <div class="iconos-barra">
        <div class="icono-accion" id="reproducirBtn" title="Repetir última respuesta">⟳</div>
        <div class="icono-accion principal" id="preguntarBtn" title="Reproducir todas las citas del modo"><span class="play-icon" id="playIcon">▶</span></div>
        <div class="icono-accion" id="microBtn" title="Hablar por micrófono">🎙</div>
    </div>
</div>

<div class="btn-modo" id="btnModo" title="Modo">🎭</div>
<div class="btn-voz" id="btnVoz" title="Estilo de voz">🎙️</div>

<div class="modo-panel" id="modoPanel">
    <div class="modo-opcion activo" data-modo="clasico"><span>🔮</span>Clásico</div>
    <div class="modo-opcion" data-modo="feminista"><span>🚺</span>Feminista</div>
    <div class="modo-opcion" data-modo="humor"><span>😂</span>Humor</div>
    <div class="modo-opcion" data-modo="sabiduria"><span>🌿</span>Estoico</div>
    <div class="modo-opcion" data-modo="feliz"><span>😊</span>Feliz</div>
    <div class="modo-opcion" data-modo="melancolico"><span>😢</span>Melancólico</div>
    <div class="modo-opcion" data-modo="motivacion"><span>💪</span>Motivación</div>
    <div class="modo-opcion" data-modo="calma"><span>🧘</span>Calma</div>
</div>
<div class="voz-panel" id="vozPanel">
    <div class="voz-opcion activo" data-voz="auto"><span>✨</span>Auto</div>
    <div class="voz-opcion" data-voz="grave"><span>🎸</span>Grave</div>
    <div class="voz-opcion" data-voz="aguda"><span>🎻</span>Aguda</div>
    <div class="voz-opcion" data-voz="calma"><span>🧘</span>Calma</div>
    <div class="voz-opcion" data-voz="motivador"><span>💪</span>Motivador</div>
    <div class="voz-opcion" data-voz="sabia"><span>🦉</span>Sabia</div>
</div>
<div class="btn-stats" id="statsBtn">📊</div>
<div class="info-externa">📱 Toca bola | 🎭 Modo | 🎙️ Voz | ▶ Reproducir | 🎙 Hablar | ⟳ Repetir</div>
<div class="toast" id="toast"></div>
<div class="stats-panel" id="statsPanel">
    <div class="stats-header"><span>📊 ESTADÍSTICAS</span><button class="stats-cerrar" id="statsCerrar">✕</button></div>
    <div class="stats-resumen" id="statsResumen"></div>
    <div class="stats-lista" id="statsLista"></div>
</div>

<script src="app.js"></script>
</body>
</html>
