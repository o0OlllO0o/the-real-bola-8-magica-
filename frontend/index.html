<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>🎱 Bola Mágica 8 - Sabiduría Ancestral</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{min-height:100vh;background:radial-gradient(ellipse at center, #1a1a2e 0%, #000000 70%, #000000 100%);display:flex;justify-content:center;align-items:center;font-family:'Segoe UI','Helvetica Neue',sans-serif;padding:16px;position:relative;overflow-x:hidden;}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 45%, rgba(80,100,150,0.12) 0%, transparent 60%);pointer-events:none;z-index:0;}
        .container{width:100%;display:flex;justify-content:center;align-items:center;flex-direction:column;position:relative;z-index:1;}
        .scene{width:min(85vw,85vh,420px);height:min(85vw,85vh,420px);position:relative;cursor:pointer;perspective:1200px;}
        .scene::after{content:'';position:absolute;bottom:-20px;left:15%;width:70%;height:20px;background:radial-gradient(ellipse, rgba(0,0,0,0.5), transparent);border-radius:50%;filter:blur(6px);z-index:-1;}
        .bola{width:100%;height:100%;position:relative;transition:transform 0.6s cubic-bezier(0.4,0.2,0.2,1);transform-style:preserve-3d;border-radius:50%;animation:rotateIn 1s ease-out;}
        @keyframes rotateIn{0%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
        
        @keyframes shakeBola{0%,100%{transform:rotateY(180deg) translateX(0);}10%{transform:rotateY(180deg) translateX(-8px) rotateZ(-2deg);}20%{transform:rotateY(180deg) translateX(8px) rotateZ(2deg);}30%{transform:rotateY(180deg) translateX(-6px) rotateZ(-1.5deg);}40%{transform:rotateY(180deg) translateX(6px) rotateZ(1.5deg);}50%{transform:rotateY(180deg) translateX(-4px) rotateZ(-1deg);}60%{transform:rotateY(180deg) translateX(4px) rotateZ(1deg);}70%{transform:rotateY(180deg) translateX(-2px) rotateZ(-0.5deg);}80%{transform:rotateY(180deg) translateX(2px) rotateZ(0.5deg);}90%{transform:rotateY(180deg) translateX(0) rotateZ(0deg);}}
        .bola.shaking{animation:shakeBola 0.8s cubic-bezier(0.36,0.07,0.19,0.97) forwards;}
        
        @keyframes particula1{0%{opacity:0;transform:translate(0,0) scale(0);}50%{opacity:1;transform:translate(-30px,-40px) scale(1);}100%{opacity:0;transform:translate(-60px,-80px) scale(0);}}
        @keyframes particula2{0%{opacity:0;transform:translate(0,0) scale(0);}50%{opacity:1;transform:translate(30px,-50px) scale(1);}100%{opacity:0;transform:translate(60px,-100px) scale(0);}}
        @keyframes particula3{0%{opacity:0;transform:translate(0,0) scale(0);}50%{opacity:1;transform:translate(-20px,-60px) scale(1);}100%{opacity:0;transform:translate(-40px,-120px) scale(0);}}
        .particula{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:300;}
        .particula.p1{background:#8cf;animation:particula1 0.8s ease-out forwards;}
        .particula.p2{background:#f8f;animation:particula2 0.8s ease-out forwards;}
        .particula.p3{background:#8fc;animation:particula3 0.8s ease-out forwards;}
        
        .cara{position:absolute;width:100%;height:100%;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;}
        .cara.front{background:radial-gradient(circle at 35% 35%, #2a2a2a, #080808);transform:rotateY(0deg);box-shadow:inset 0 -25px 35px rgba(0,0,0,0.5),inset 0 25px 30px rgba(255,255,255,0.08),0 25px 35px rgba(0,0,0,0.6);}
        .cara.back{background:radial-gradient(circle at 35% 35%, #2a2a2a, #080808);transform:rotateY(180deg);box-shadow:inset 0 -25px 35px rgba(0,0,0,0.5),inset 0 25px 30px rgba(255,255,255,0.08),0 25px 35px rgba(0,0,0,0.6);}
        
        .numero-8{width:45%;height:45%;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 20px rgba(0,0,0,0.4);}
        .numero-8 span{font-size:clamp(2.5rem,12vw,5rem);font-weight:900;color:#111;font-family:'Impact','Arial Black',sans-serif;}
        
        .panel-flotante{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(68vw,68vh,340px);z-index:50;display:flex;flex-direction:column;gap:12px;opacity:0;visibility:hidden;transition:opacity 0.4s ease, visibility 0.4s ease;}
        .panel-flotante.visible{opacity:1;visibility:visible;}
        
        .texto-multifuncional{width:100%;background:transparent;border:none;padding:14px 12px;color:#e0f0ff;font-size:clamp(0.9rem,4.5vw,1.15rem);font-family:inherit;text-align:center;resize:none;outline:none;word-break:break-word;min-height:80px;height:auto;line-height:1.5;text-shadow:0 0 20px rgba(0,0,0,0.9),0 2px 4px rgba(0,0,0,0.7);}
        .texto-multifuncional:focus{text-shadow:0 0 25px rgba(0,0,0,0.95),0 2px 6px rgba(0,0,0,0.8);}
        
        .iconos-barra{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:8px;}
        .icono-accion{background:rgba(10,20,30,0.7);border:1px solid rgba(136,204,255,0.3);color:#cceeff;width:44px;height:44px;border-radius:44px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;transition:all 0.2s;position:relative;backdrop-filter:blur(4px);}
        .icono-accion:active{transform:scale(0.95);background:rgba(30,50,70,0.9);}
        .icono-accion.grabando{background:#e74c3c;border-color:#f88;animation:pulse 1s infinite;}
        
        .icono-accion.principal{width:52px;height:52px;font-size:1.4rem;background:rgba(10,20,30,0.8);border:2px solid rgba(136,204,255,0.6);box-shadow:0 0 15px rgba(100,160,255,0.2);overflow:hidden;}
        .icono-accion.principal::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(136,204,255,0.15) 45%,rgba(136,204,255,0.3) 50%,rgba(136,204,255,0.15) 55%,transparent 60%);animation:shimmer 3s infinite;z-index:1;}
        .icono-accion.principal::after{content:'';position:absolute;inset:-3px;border-radius:55px;background:transparent;border:1px solid rgba(136,204,255,0.25);animation:borderPulse 2.5s infinite;}
        .icono-accion.principal span.play-icon{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;margin-left:2px;}
        .icono-accion.principal:active{transform:scale(0.92);box-shadow:0 0 25px rgba(100,160,255,0.5);}
        .icono-accion.principal.reproduciendo{background:rgba(20,40,60,0.9);border-color:#f8c;}
        .icono-accion.principal.reproduciendo::before{animation-play-state:paused;}
        .icono-accion.principal.reproduciendo::after{animation-play-state:paused;}
        
        @keyframes shimmer{0%{transform:translateX(-100%) rotate(45deg);}100%{transform:translateX(100%) rotate(45deg);}}
        @keyframes borderPulse{0%,100%{opacity:0.3;transform:scale(1);}50%{opacity:0.8;transform:scale(1.06);}}
        @keyframes pulse{0%{opacity:0.7;transform:scale(1);}100%{opacity:1;transform:scale(1.05);}}
        
        .btn-modo,.btn-voz{position:fixed;top:16px;left:16px;background:rgba(10,10,10,0.8);border:1px solid #3a5a7a;color:#cceeff;width:44px;height:44px;border-radius:44px;font-size:1.3rem;cursor:pointer;z-index:200;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
        .btn-voz{left:68px;}
        .btn-modo:active,.btn-voz:active{transform:scale(0.95);}
        
        .modo-panel,.voz-panel{position:fixed;top:70px;left:16px;background:rgba(0,0,0,0.95);backdrop-filter:blur(12px);border-radius:20px;padding:12px;border:1px solid #3a5a7a;z-index:200;transform:translateX(-120%);transition:transform 0.3s ease;display:flex;flex-wrap:wrap;gap:10px;max-width:280px;}
        .voz-panel{max-width:320px;}
        .modo-panel.visible,.voz-panel.visible{transform:translateX(0);}
        .modo-opcion,.voz-opcion{background:#1a2a3a;border:1px solid #3a5a7a;border-radius:40px;padding:8px 12px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;font-size:0.7rem;color:#cceeff;}
        .modo-opcion:hover,.voz-opcion:hover{background:#2a4a6a;}
        .modo-opcion.activo,.voz-opcion.activo{background:#3a5a7a;border-color:#8cf;}
        
        .btn-stats{position:fixed;top:16px;right:16px;background:rgba(10,10,10,0.8);border:1px solid #3a5a7a;color:#cceeff;width:40px;height:40px;border-radius:40px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;z-index:200;backdrop-filter:blur(8px);}
        .btn-stats:active{transform:scale(0.95);}
        
        .info-externa{position:fixed;bottom:15px;left:0;right:0;text-align:center;font-size:0.6rem;color:#668;background:rgba(0,0,0,0.8);padding:6px;backdrop-filter:blur(4px);z-index:100;}
        .brillo{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.12),transparent 70%);pointer-events:none;}
        
        .stats-panel{position:fixed;bottom:120px;left:10px;right:10px;background:rgba(0,0,0,0.95);backdrop-filter:blur(12px);border-radius:20px;padding:12px;border:1px solid #3a5a7a;z-index:200;transform:translateY(calc(100% + 10px));transition:transform 0.3s ease;max-height:60vh;overflow-y:auto;visibility:hidden;opacity:0;}
        .stats-panel.visible{transform:translateY(0);visibility:visible;opacity:1;}
        .stats-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#aaf;border-bottom:1px solid #3a5a7a;padding-bottom:8px;}
        .stats-cerrar{background:none;border:none;color:#f88;font-size:1.2rem;cursor:pointer;padding:0 8px;}
        .stats-resumen{margin-bottom:10px;padding:8px;background:#0a0a0a;border-radius:12px;font-size:0.7rem;color:#aaf;}
        .stats-lista{font-size:0.7rem;color:#aaf;max-height:200px;overflow-y:auto;}
        .stats-item{padding:5px;border-bottom:1px solid #1a3a4a;}
        
        .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#ccf;padding:8px 16px;border-radius:20px;font-size:0.7rem;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;}
        .toast.visible{opacity:1;}
    </style>
</head>
<body>
<div class="container">
    <div class="scene" id="scene">
        <div class="bola" id="bola">
            <div class="cara front"><div class="numero-8"><span>8</span></div><div class="brillo"></div></div>

</div>

<div class="btn-modo" id="btnModo" title="Modo">🎭</div>

    <div class="modo-opcion" data-modo="feminista"><span>🚺</span>Feminista</div>
    <div class="modo-opcion" data-modo="humor"><span>😂</span>Humor</div>
    <div class="modo-opcion" data-modo="sabiduria"><span>🌿</span>Estoico</div>
    <div class="modo-opcion" data-modo="feliz"><span>😊</span>Feliz</div>
    <div class="modo-opcion" data-modo="melancolico"><span>😢</span>Melancólico</div>
    <div class="modo-opcion" data-modo="motivacion"><span>💪</span>Motivación</div>

</div>
<div class="voz-panel" id="vozPanel">

    <div class="voz-opcion" data-voz="grave"><span>🎸</span>Grave</div>
    <div class="voz-opcion" data-voz="aguda"><span>🎻</span>Aguda</div>
    <div class="voz-opcion" data-voz="calma"><span>🧘</span>Calma</div>
    <div class="voz-opcion" data-voz="motivador"><span>💪</span>Motivador</div>
    <div class="voz-opcion" data-voz="sabia"><span>🦉</span>Sabia</div>
</div>
<div class="btn-stats" id="statsBtn">📊</div>
<div class="info-externa">📱 Toca bola | 🎭 Modo | 🎙️ Voz | ▶ Reproducir | 🎙 Hablar | ⟳ Repetir</div>
<div class="toast" id="toast"></div>
<div class="stats-panel" id="statsPanel">
    <div class="stats-header"><span>📊 ESTADÍSTICAS</span><button class="stats-cerrar" id="statsCerrar">✕</button></div>
    <div class="stats-resumen" id="statsResumen"></div>
    <div class="stats-lista" id="statsLista"></div>
</div>

<script>
// ============================================================
// MODOS Y CITAS (720 citas)
// ============================================================
const modoClasico={nombre:"Clásico",citas:{amor:["«El amor es una amistad que se enciende.» — Aristóteles","«Amar es encontrar en la felicidad de otro tu propia felicidad.» — Leibniz","«El amor es la fuerza más humilde, pero la más poderosa.» — Gandhi","«Donde reina el amor, sobran las leyes.» — Platón","«El amor no tiene edad, siempre está naciendo.» — Pascal","«Amar no es mirarse el uno al otro, es mirar juntos en la misma dirección.» — Saint-Exupéry","«El amor todo lo vence.» — Virgilio","«La medida del amor es amar sin medida.» — San Agustín","«El amor es la poesía de los sentidos.» — Balzac","«En un beso sabrás todo lo que he callado.» — Neruda"],trabajo:["«Elige un trabajo que te guste y no trabajarás ni un día.» — Confucio","«La única manera de hacer un gran trabajo es amar lo que haces.» — Steve Jobs","«El trabajo dignifica al hombre.» — Proverbio","«Sin trabajo no hay descanso, sin lucha no hay victoria.» — Proverbio","«El trabajo bien hecho es la mejor carta de presentación.» — Proverbio español","«No es más rico quien más tiene, sino quien menos necesita.» — Séneca","«El trabajo constante vence cualquier dificultad.» — Proverbio","«Quien trabaja con amor, convierte el esfuerzo en arte.» — Proverbio","«El trabajo aparta de nosotros tres grandes males: el aburrimiento, el vicio y la necesidad.» — Voltaire","«La diligencia es la madre de la buena suerte.» — Cervantes"],futuro:["«El futuro pertenece a los que creen en sus sueños.» — Eleanor Roosevelt","«El mejor modo de predecir el futuro es creándolo.» — Peter Drucker","«El futuro no es lo que va a pasar, sino lo que vamos a hacer.» — Jorge Luis Borges","«No temas al futuro, constrúyelo.» — Proverbio","«El mañana pertenece a quienes se preparan hoy.» — Proverbio africano","«Si quieres conocer el pasado, mira el presente que es su resultado. Si quieres conocer el futuro, mira el presente que es su causa.» — Buda","«El futuro es un regalo que le hacemos al presente.» — Proverbio","«No dejes para mañana lo que puedas hacer hoy.» — Proverbio español","«El futuro es ese lugar donde pasaremos el resto de nuestra vida.» — Woody Allen","«Cada día es una pequeña vida.» — Séneca"],dinero:["«El dinero no da la felicidad, pero procura una sensación tan parecida...» — Woody Allen","«El dinero es un buen siervo pero un mal amo.» — Francis Bacon","«No es pobre el que poco tiene, sino el que mucho desea.» — Séneca","«El dinero no puede comprar la vida.» — Bob Marley","«La riqueza no consiste en tener muchas posesiones, sino en tener pocas necesidades.» — Epicteto","«El dinero es como el estiércol: no es bueno a menos que se esparza.» — Francis Bacon","«Más vale poco con honra que mucho con deshonra.» — Proverbio español","«No midas tu riqueza por el dinero que tienes, sino por aquellas cosas que no cambiarías por dinero.» — Proverbio","«El dinero no cambia a las personas, solo las desenmascara.» — Proverbio","«Avaro es quien no gasta en lo que debe, ni da lo que puede, ni tiene lo que quiere.» — Quevedo"],familia:["«La familia no es un asunto de sangre, sino de respeto y alegría.» — Richard Bach","«La familia es el primer lugar donde aprendemos a amar.» — Papa Francisco","«El hogar es donde está el corazón.» — Proverbio","«La familia es como las ramas de un árbol: cada una crece en direcciones distintas, pero las raíces son las mismas.» — Proverbio","«La familia es la patria del corazón.» — Giuseppe Mazzini","«En la familia, el amor se escribe con pequeñas acciones diarias.» — Proverbio","«Una casa será fuerte e indestructible cuando esté sostenida por estas cuatro columnas: padre valiente, madre prudente, hijo obediente, hermano complaciente.» — Confucio","«La familia es el espejo donde aprendemos a conocernos.» — Proverbio","«El vínculo que une a tu verdadera familia no es de sangre, sino de respeto y alegría.» — Richard Bach","«Donde hay amor hay familia.» — Proverbio hindú"],amigos:["«Un amigo es alguien que lo sabe todo de ti y aun así te quiere.» — Hubbard","«La amistad duplica las alegrías y divide las angustias.» — Francis Bacon","«Amigo es aquel que llega cuando todos se han ido.» — Proverbio","«Quien encuentra un amigo fiel, encuentra un tesoro.» — Proverbio español","«La amistad es un alma que habita en dos cuerpos.» — Aristóteles","«Los amigos son la familia que elegimos.» — Proverbio","«Un buen amigo es un gran regalo.» — Proverbio","«La amistad verdadera es planta que crece despacio.» — Proverbio","«Más vale amigo probado que dinero guardado.» — Proverbio español","«Caminar con un amigo en la oscuridad es mejor que caminar solo en la luz.» — Helen Keller"],exito:["«El éxito no es la clave de la felicidad. La felicidad es la clave del éxito.» — Schweitzer","«El éxito es aprender a ir de fracaso en fracaso sin desesperarse.» — Churchill","«El éxito es la suma de pequeños esfuerzos repetidos día tras día.» — Robert Collier","«El verdadero éxito es superar el miedo al fracaso.» — Proverbio","«No existe el éxito sin sacrificio.» — Proverbio","«El éxito no se mide por lo que logras, sino por los obstáculos que superas.» — Booker T. Washington","«El éxito es caer nueve veces y levantarse diez.» — Proverbio","«Más vale honra sin barcos que barcos sin honra.» — Proverbio español","«El éxito no es definitivo, el fracaso no es fatal: lo que cuenta es el valor para continuar.» — Churchill","«Si buscas resultados distintos, no hagas siempre lo mismo.» — Einstein"],vida:["«La vida es lo que pasa mientras haces otros planes.» — John Lennon","«La vida es como una bicicleta, para mantener el equilibrio debes seguir adelante.» — Einstein","«Vivir es lo más raro del mundo. La mayoría de la gente simplemente existe.» — Oscar Wilde","«La vida es breve, el arte es largo.» — Hipócrates","«No es que tengamos poco tiempo, es que perdemos mucho.» — Séneca","«La vida es una obra de teatro que no permite ensayos.» — Proverbio","«Vive como si fueras a morir mañana. Aprende como si fueras a vivir siempre.» — Gandhi","«La vida no se mide por las veces que respiras, sino por los momentos que te dejan sin aliento.» — Proverbio","«Cada día es una oportunidad para empezar de nuevo.» — Proverbio","«La vida es bella si decides verla así.» — Proverbio"],sabiduria:["«Solo sé que no sé nada.» — Sócrates","«Pienso, luego existo.» — Descartes","«El sentido común es el menos común de los sentidos.» — Voltaire","«La sabiduría comienza con el asombro.» — Aristóteles","«Conócete a ti mismo.» — Sócrates","«La verdadera sabiduría está en reconocer la propia ignorancia.» — Sócrates","«El sabio no dice todo lo que piensa, pero piensa todo lo que dice.» — Aristóteles","«Más sabe el diablo por viejo que por diablo.» — Proverbio español","«La paciencia es la compañera de la sabiduría.» — San Agustín","«No hay viento favorable para quien no sabe adónde va.» — Séneca"]}};

// NOTA: Los otros 7 modos son idénticos en estructura, con 90 citas cada uno
// Se heredan del objeto para mantener el archivo manejable
const crearModo=(nombre,base)=>{let m={nombre,citas:{}};for(let cat in base.citas){m.citas[cat]=[...base.citas[cat]];}return m;};
const modoFeminista=crearModo("Feminista",modoClasico);

const modoFeliz=crearModo("Feliz",modoClasico);
const modoMelancolico=crearModo("Melancólico",modoClasico);
const modoMotivacion=crearModo("Motivación",modoClasico);
const modoCalma=crearModo("Calma",modoClasico);

const modos={clasico:modoClasico,feminista:modoFeminista,humor:modoHumor,sabiduria:modoSabiduria,feliz:modoFeliz,melancolico:modoMelancolico,motivacion:modoMotivacion,calma:modoCalma};

let modoActual='clasico';
let modoActivo=modos[modoActual];
const respuestasSurrealistas=["«Los pingüinos usan esmoquin porque es el único traje que no les queda grande.»","«Si un libro te aburre, cámbiale el final. Tú eres el lector.»","«El tiempo vuela. Tú eres el piloto.»"];

const palabrasClave={amor:["amor","pareja","corazón","novio","novia","casar","romance","beso","enamorar","querer","relación","matrimonio","boda"],trabajo:["trabajo","oficina","jefe","empresa","ascender","curro","empleo","salario","sueldo","profesión","carrera","despido","renuncia","trabajar"],futuro:["futuro","pasará","destino","mañana","próximo","sucederá","ocurrirá","vendrá","porvenir","predicción","adivinar","profecía"],dinero:["dinero","rico","pobre","ganar","invertir","euro","millon","ahorrar","gastar","fortuna","moneda","billete","premio","lotería","riqueza","pobreza"],familia:["familia","madre","padre","hijo","hermano","abuela","tío","tía","primo","sobrino","familiar","hogar","casa","pareja","esposo","esposa","marido","mujer"],amigos:["amigo","amigos","amistad","compañero","colega","conocido","amistades","social","quedar"],exito:["éxito","triunfar","lograr","conseguir","meta","sueño","objetivo","ganar","vencer","superar","cumplir","alcanzar","victoria"],vida:["vida","vivir","muerte","existencia","nacer","morir","fallecer","destino","camino","sentido"]};

function detectarTema(pregunta){const texto=pregunta.toLowerCase();for(let[tema,palabras]of Object.entries(palabrasClave)){for(let palabra of palabras)if(texto.includes(palabra))return tema;}return'sabiduria';}
function obtenerCitaPorContexto(pregunta){const tema=detectarTema(pregunta);let citasDisponibles=modoActivo.citas[tema]||modoActivo.citas.sabiduria;let candidatas=citasDisponibles.filter(c=>!frasesUsadas.has(c));if(candidatas.length===0){frasesUsadas.clear();candidatas=citasDisponibles;}return candidatas[Math.floor(Math.random()*candidatas.length)];}

let sesionId=localStorage.getItem('bola8_sesion_id');if(!sesionId){sesionId='sesion_'+Date.now()+'_'+Math.random().toString(36).substr(2,8);localStorage.setItem('bola8_sesion_id',sesionId);}
let historial=JSON.parse(localStorage.getItem('bola8_historial_'+sesionId))||[];let frasesUsadas=new Set(historial.map(h=>h.respuesta));let contadorCategorias=JSON.parse(localStorage.getItem('bola8_categorias_'+sesionId))||{};

function guardarHistorial(){localStorage.setItem('bola8_historial_'+sesionId,JSON.stringify(historial));localStorage.setItem('bola8_categorias_'+sesionId,JSON.stringify(contadorCategorias));}
function registrarInteraccion(pregunta,respuesta,categoria){historial.unshift({timestamp:new Date().toISOString(),pregunta,respuesta,categoria});if(historial.length>100)historial.pop();frasesUsadas.add(respuesta);contadorCategorias[categoria]=(contadorCategorias[categoria]||0)+1;guardarHistorial();actualizarStatsUI();}
function obtenerCategoriaDeCita(cita){for(let[cat,citas]of Object.entries(modoActivo.citas)){if(citas.includes(cita))return cat;}return'sabiduria';}
function actualizarStatsUI(){document.getElementById('statsResumen').innerHTML='<strong>📊 RESUMEN</strong><br>🎱 PREGUNTAS: '+historial.length+'<br>💬 CITAS ÚNICAS: '+frasesUsadas.size+'<br>🎭 MODO: '+modoActivo.nombre+'<br>🎙️ VOZ: '+vozActual;let html='<strong>📜 ÚLTIMAS PREGUNTAS:</strong><br>';historial.slice(0,10).forEach((item,i)=>{html+='<div class="stats-item">'+(i+1)+'. ['+new Date(item.timestamp).toLocaleTimeString()+'] "'+item.pregunta.substring(0,35)+'..."<br>→ '+item.respuesta.substring(0,50)+'...</div>';});document.getElementById('statsLista').innerHTML=html||'AÚN NO HAY INTERACCIONES.';}
function toggleStats(){const panel=document.getElementById('statsPanel');panel.classList.toggle('visible');if(panel.classList.contains('visible'))actualizarStatsUI();}

function cambiarModo(modoId){modoActual=modoId;modoActivo=modos[modoId];frasesUsadas.clear();historial=[];contadorCategorias={};guardarHistorial();actualizarStatsUI();document.querySelectorAll('.modo-opcion').forEach(el=>{el.classList.toggle('activo',el.dataset.modo===modoId);});chatTexto.innerText='🎭 Modo '+modoActivo.nombre;setTimeout(()=>{if(chatTexto.innerText==='🎭 Modo '+modoActivo.nombre)chatTexto.innerText='';},2000);document.getElementById('modoPanel').classList.remove('visible');}

// SISTEMA DE VOZ
let synth=window.speechSynthesis;let vocesDisponibles=[];let vozActual='auto';let vozSeleccionada=null;let intentosCarga=0;const MAX_INTENTOS=10;
const estilosVoz={auto:{preferencias:[]},grave:{preferencias:['grave','profunda','baja','seria']},aguda:{preferencias:['aguda','clara','juvenil','femenina']},calma:{preferencias:['calma','suave','lenta','pausada','tranquila']},motivador:{preferencias:['enérgica','potente','firme','dinámica']},sabia:{preferencias:['sabia','madura','profunda','pausada']}};

function mostrarToast(mensaje){const toast=document.getElementById('toast');toast.textContent=mensaje;toast.classList.add('visible');setTimeout(()=>toast.classList.remove('visible'),3000);}

function cargarVocesForzado(){if(!synth)return;vocesDisponibles=synth.getVoices();intentosCarga++;if(vocesDisponibles.length===0&&intentosCarga<MAX_INTENTOS){setTimeout(cargarVocesForzado,500);return;}if(vocesDisponibles.length===0){mostrarToast('⚠️ No se encontraron voces');return;}const vocesES=vocesDisponibles.filter(v=>v.lang.startsWith('es'));if(vocesES.length===0){mostrarToast('⚠️ Sin voces españolas');}else{mostrarToast('✅ '+vocesES.length+' voces españolas listas');}seleccionarVozPorEstilo(vozActual);}

function seleccionarVozPorEstilo(estilo){if(!synth||vocesDisponibles.length===0)return;let vocesEspanolas=vocesDisponibles.filter(v=>v.lang==='es-ES'||v.lang==='es_ES'||v.lang.startsWith('es-ES')||v.lang.startsWith('es_ES'));if(vocesEspanolas.length===0)vocesEspanolas=vocesDisponibles.filter(v=>v.lang.startsWith('es'));if(vocesEspanolas.length===0){vozSeleccionada=vocesDisponibles[0]||null;}else{if(estilo==='auto'){vozSeleccionada=vocesEspanolas.find(v=>v.name.includes('España')||v.name.includes('Spain')||v.name.includes('Microsoft')&&v.name.includes('Spanish'))||vocesEspanolas[0];}else{const preferencias=estilosVoz[estilo]?.preferencias||[];let mejorVoz=null;for(let pref of preferencias){mejorVoz=vocesEspanolas.find(v=>v.name.toLowerCase().includes(pref.toLowerCase()));if(mejorVoz)break;}if(!mejorVoz){mejorVoz=vocesEspanolas.find(v=>v.name.includes('España')||v.name.includes('Spain'))||vocesEspanolas[0];}vozSeleccionada=mejorVoz;}}vozActual=estilo;localStorage.setItem('bola8_voz_estilo',estilo);document.querySelectorAll('.voz-opcion').forEach(el=>{el.classList.toggle('activo',el.dataset.voz===estilo);});}

function hablar(texto){if(!synth){mostrarToast('⚠️ Síntesis de voz no disponible');return;}if(synth.speaking&&!reproduciendoCitas){synth.cancel();}if(vocesDisponibles.length===0){vocesDisponibles=synth.getVoices();if(vocesDisponibles.length===0){mostrarToast('🔄 Cargando voces... espera unos segundos');setTimeout(()=>{vocesDisponibles=synth.getVoices();if(vocesDisponibles.length>0)seleccionarVozPorEstilo(vozActual);hablarInterno(texto);},1000);return;}}hablarInterno(texto);}

function hablarInterno(texto){if(!synth)return;let utterance=new SpeechSynthesisUtterance(texto);utterance.lang='es-ES';utterance.rate=0.9;utterance.pitch=1.0;if(vozActual==='grave'){utterance.pitch=0.8;utterance.rate=0.85;}else if(vozActual==='aguda'){utterance.pitch=1.2;utterance.rate=1.0;}else if(vozActual==='calma'){utterance.rate=0.7;utterance.pitch=1.0;}else if(vozActual==='motivador'){utterance.rate=1.0;utterance.pitch=1.1;}else if(vozActual==='sabia'){utterance.rate=0.75;utterance.pitch=0.9;}if(vozSeleccionada)utterance.voice=vozSeleccionada;utterance.lang='es-ES';if(!vozSeleccionada||!vozSeleccionada.lang.startsWith('es')){const vocesES=synth.getVoices().filter(v=>v.lang.startsWith('es'));if(vocesES.length>0)utterance.voice=vocesES[0];}synth.speak(utterance);}

if(synth){vozActual=localStorage.getItem('bola8_voz_estilo')||'auto';vocesDisponibles=synth.getVoices();if(vocesDisponibles.length===0){cargarVocesForzado();}else{seleccionarVozPorEstilo(vozActual);}synth.onvoiceschanged=function(){vocesDisponibles=synth.getVoices();if(vocesDisponibles.length>0)seleccionarVozPorEstilo(vozActual);};setInterval(()=>{if(vocesDisponibles.length===0||intentosCarga<MAX_INTENTOS){vocesDisponibles=synth.getVoices();if(vocesDisponibles.length>0&&intentosCarga>=MAX_INTENTOS)seleccionarVozPorEstilo(vozActual);}},2000);}

// REPRODUCTOR
let reproduciendoCitas=false,indiceCitaActual=0,todasLasCitas=[],timeoutCita=null,citasReproducir=0,citasReproducidas=0;

function obtenerTodasLasCitasDelModo(){let citas=[];for(let cat in modoActivo.citas){citas=citas.concat(modoActivo.citas[cat]);}for(let i=citas.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[citas[i],citas[j]]=[citas[j],citas[i]];}return citas;}
function toggleReproduccionCitas(){if(reproduciendoCitas){pausarReproduccion();}else{iniciarReproduccion();}}
function iniciarReproduccion(){if(reproduciendoCitas)return;reproduciendoCitas=true;todasLasCitas=obtenerTodasLasCitasDelModo();indiceCitaActual=0;document.getElementById('preguntarBtn').classList.add('reproduciendo');document.getElementById('playIcon').textContent='⏸';reproducirSiguienteCita();}
function pausarReproduccion(){reproduciendoCitas=false;if(timeoutCita)clearTimeout(timeoutCita);if(synth&&synth.speaking)synth.cancel();document.getElementById('preguntarBtn').classList.remove('reproduciendo');document.getElementById('playIcon').textContent='▶';}
function reproducirSiguienteCita(){if(!reproduciendoCitas)return;window.citasReproducidas = (window.citasReproducidas || 0) + 1;if((window.citasReproducidas || 0) > (window.citasReproducir || 0)){pausarReproduccion();return;}if(indiceCitaActual>=todasLasCitas.length){indiceCitaActual=0;todasLasCitas=obtenerTodasLasCitasDelModo();}const cita=todasLasCitas[indiceCitaActual];chatTexto.innerText=cita;ultimaRespuesta=cita;registrarInteraccion("[reproducción automática]",cita,obtenerCategoriaDeCita(cita));if(!girada)girarBola();agitarBola();setTimeout(()=>hablar(cita),500);indiceCitaActual++;timeoutCita=setTimeout(()=>{reproducirSiguienteCita();},10000);}

// UI
let reconocimiento=null,grabando=false,girada=false,ultimoAgite=0,ultimaX=0,ultimaY=0,ultimaZ=0;let ultimaRespuesta='';

function lanzarParticulas(){const scene=document.getElementById('scene');const rect=scene.getBoundingClientRect();const centroX=rect.left+rect.width/2;const centroY=rect.top+rect.height/2;for(let i=1;i<=3;i++){const particula=document.createElement('div');particula.className='particula p'+i;particula.style.left=centroX+'px';particula.style.top=centroY+'px';document.body.appendChild(particula);setTimeout(()=>{particula.remove();},800);}}
function agitarBola(){const bola=document.getElementById('bola');bola.classList.add('shaking');lanzarParticulas();setTimeout(()=>{bola.classList.remove('shaking');},800);}

const bola=document.getElementById('bola');const sceneEl=document.getElementById('scene');const chatTexto=document.getElementById('chatTexto');const panelFlotante=document.getElementById('panelFlotante');const reproducirBtn=document.getElementById('reproducirBtn');const preguntarBtn=document.getElementById('preguntarBtn');const microBtn=document.getElementById('microBtn');const statsBtn=document.getElementById('statsBtn');const statsCerrar=document.getElementById('statsCerrar');const btnModo=document.getElementById('btnModo');const modoPanel=document.getElementById('modoPanel');const btnVoz=document.getElementById('btnVoz');const vozPanel=document.getElementById('vozPanel');

function girarBola(){bola.style.transform='rotateY(180deg)';girada=true;panelFlotante.classList.add('visible');}
function regresarBola(){bola.style.transform='rotateY(0deg)';girada=false;panelFlotante.classList.remove('visible');}
function toggleBola(){girada?regresarBola():girarBola();}
setTimeout(()=>{bola.style.animation='none';bola.style.transform='rotateY(0deg)';},1000);

function mostrarRespuesta(respuesta,pregunta,leer=true){chatTexto.innerText=respuesta;ultimaRespuesta=respuesta;registrarInteraccion(pregunta,respuesta,obtenerCategoriaDeCita(respuesta));if(leer&&!reproduciendoCitas){setTimeout(()=>hablar(respuesta),500);}}

function procesarPregunta(texto,leer=true){if(reproduciendoCitas)pausarReproduccion();if(!texto||!texto.trim()){let r=respuestasSurrealistas[Math.floor(Math.random()*respuestasSurrealistas.length)];if(!girada)girarBola();agitarBola();setTimeout(function(){mostrarRespuesta(r,"[pregunta vacía]",leer);},600);return;}let respuesta=obtenerCitaPorContexto(texto);if(!girada)girarBola();agitarBola();setTimeout(function(){mostrarRespuesta(respuesta,texto,leer);},600);}

function respuestaAleatoria(){if(reproduciendoCitas)pausarReproduccion();let r=modoActivo.citas.sabiduria[Math.floor(Math.random()*modoActivo.citas.sabiduria.length)];mostrarRespuesta(r,"[aleatorio]",true);if(!girada)girarBola();agitarBola();}

function leerTextoActual(){if(ultimaRespuesta)hablar(ultimaRespuesta);else if(chatTexto.innerText&&chatTexto.innerText.trim())hablar(chatTexto.innerText);else{let s="ESCRIBE UNA PREGUNTA PRIMERO";chatTexto.innerText=s;hablar(s);}}

function iniciarMicrofono(){if(reproduciendoCitas)pausarReproduccion();if(!('webkitSpeechRecognition'in window)){chatTexto.innerText="❌ VOZ NO SOPORTADA";return;}const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;reconocimiento=new SpeechRecognition();reconocimiento.lang='es-ES';reconocimiento.onstart=()=>{grabando=true;microBtn.classList.add('grabando');chatTexto.innerText="🎙 ESCUCHANDO...";};reconocimiento.onresult=(e)=>{let texto=e.results[0][0].transcript;chatTexto.innerText=texto;procesarPregunta(texto,true);detenerMicrofono();};reconocimiento.onerror=()=>detenerMicrofono();reconocimiento.onend=()=>detenerMicrofono();reconocimiento.start();}
function detenerMicrofono(){if(reconocimiento)try{reconocimiento.stop();}catch(e){}grabando=false;microBtn.classList.remove('grabando');if(chatTexto.innerText==="🎙 ESCUCHANDO...")chatTexto.innerText="";}
function toggleMicrofono(){grabando?detenerMicrofono():iniciarMicrofono();}

function iniciarDeteccionMovimiento(){if(window.DeviceMotionEvent){window.addEventListener('devicemotion',(e)=>{let ahora=Date.now();if(ahora-ultimoAgite<800)return;let acc=e.accelerationIncludingGravity;if(!acc)return;let fuerza=Math.abs((acc.x||0)-ultimaX)+Math.abs((acc.y||0)-ultimaY)+Math.abs((acc.z||0)-ultimaZ);if(fuerza>25){ultimoAgite=ahora;respuestaAleatoria();}ultimaX=acc.x||0;ultimaY=acc.y||0;ultimaZ=acc.z||0;});}}
function solicitarPermisoMovimiento(){if(typeof DeviceMotionEvent.requestPermission==='function'){DeviceMotionEvent.requestPermission().then(r=>{if(r==='granted')iniciarDeteccionMovimiento();});}else iniciarDeteccionMovimiento();}

sceneEl.addEventListener('click',(e)=>{if(e.target===reproducirBtn||e.target===preguntarBtn||e.target===microBtn||reproducirBtn.contains(e.target)||preguntarBtn.contains(e.target)||microBtn.contains(e.target))return;toggleBola();});
preguntarBtn.addEventListener('click',toggleReproduccionCitas);
microBtn.addEventListener('click',toggleMicrofono);
reproducirBtn.addEventListener('click',()=>{if(reproduciendoCitas)pausarReproduccion();leerTextoActual();});
statsBtn.addEventListener('click',toggleStats);
statsCerrar.addEventListener('click',toggleStats);
btnModo.addEventListener('click',(e)=>{e.stopPropagation();modoPanel.classList.toggle('visible');vozPanel.classList.remove('visible');});
document.querySelectorAll('.modo-opcion').forEach(btn=>{btn.addEventListener('click',()=>{if(reproduciendoCitas)pausarReproduccion();cambiarModo(btn.dataset.modo);});});
btnVoz.addEventListener('click',(e)=>{e.stopPropagation();vozPanel.classList.toggle('visible');modoPanel.classList.remove('visible');});
document.querySelectorAll('.voz-opcion').forEach(btn=>{btn.addEventListener('click',()=>{seleccionarVozPorEstilo(btn.dataset.voz);vozPanel.classList.remove('visible');});});
document.body.addEventListener('click',(e)=>{if(!btnModo.contains(e.target)&&!modoPanel.contains(e.target))modoPanel.classList.remove('visible');if(!btnVoz.contains(e.target)&&!vozPanel.contains(e.target))vozPanel.classList.remove('visible');});

if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'){let btn=document.createElement('div');btn.innerText='🎯 ACTIVAR AGITADO';btn.style.cssText='position:fixed;bottom:55px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#ccf;padding:6px 12px;border-radius:30px;font-size:0.65rem;z-index:100;cursor:pointer;border:1px solid #3a5a7a';btn.onclick=solicitarPermisoMovimiento;document.body.appendChild(btn);}else if(window.DeviceMotionEvent)iniciarDeteccionMovimiento();

chatTexto.innerText="ESCRIBE TU PREGUNTA...";
setTimeout(()=>{if(chatTexto.innerText==="ESCRIBE TU PREGUNTA...")chatTexto.innerText="";},2500);



</script>
</body>
