<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#111111">
    <title>🎱 Bola Mágica 8 - Célebre</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{min-height:100vh;background:radial-gradient(circle at 30% 20%,#1a1a2e,#050510);display:flex;justify-content:center;align-items:center;font-family:'Segoe UI','Helvetica Neue',sans-serif;padding:16px;position:relative;}
        .container{width:100%;display:flex;justify-content:center;align-items:center;flex-direction:column;}
        .scene{width:min(85vw,85vh,420px);height:min(85vw,85vh,420px);position:relative;cursor:pointer;}
        .bola{width:100%;height:100%;position:relative;transition:transform 0.6s cubic-bezier(0.4,0.2,0.2,1);transform-style:preserve-3d;border-radius:50%;animation:rotateIn 1s ease-out;}
        @keyframes rotateIn{0%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
        .cara{position:absolute;width:100%;height:100%;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -25px 35px rgba(0,0,0,0.5),inset 0 25px 30px rgba(255,255,255,0.1),0 20px 30px rgba(0,0,0,0.4);}
        .cara.front{background:radial-gradient(circle at 35% 35%,#2a2a2a,#080808);transform:rotateY(0deg);}
        .numero-8{width:45%;height:45%;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 20px rgba(0,0,0,0.4);}
        .numero-8 span{font-size:clamp(2.5rem,12vw,5rem);font-weight:900;color:#111;font-family:'Impact','Arial Black',sans-serif;}
        .cara.back{background:radial-gradient(circle at 35% 35%,#0a0a0a,#000000);transform:rotateY(180deg);padding:12%;pointer-events:auto;}
        .triangulo-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;}
        .triangulo{width:90%;height:80%;background:linear-gradient(145deg,#0a1520,#03080f);clip-path:polygon(50% 5%,5% 95%,95% 95%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15% 8% 18% 8%;border:1px solid rgba(80,180,255,0.3);border-radius:8px;box-shadow:inset 0 0 20px rgba(0,80,160,0.2),0 5px 15px rgba(0,0,0,0.3);}
        .texto-multifuncional{width:100%;background:rgba(10,20,30,0.95);border:1px solid rgba(80,180,255,0.5);border-radius:16px;padding:14px 12px;color:#d4eaff;font-size:clamp(0.7rem,3.5vw,0.9rem);font-family:inherit;text-align:center;resize:none;outline:none;backdrop-filter:blur(4px);word-break:break-word;min-height:120px;max-height:180px;overflow-y:auto;line-height:1.4;}
        .texto-multifuncional:focus{border-color:#6cf;box-shadow:0 0 8px rgba(100,200,255,0.3);}
        .botones-externos{position:fixed;bottom:70px;left:0;right:0;display:flex;justify-content:center;gap:12px;padding:10px;z-index:150;flex-wrap:wrap;}
        .btn-externo{background:#2a4a6a;border:none;color:#cceeff;padding:8px 16px;border-radius:40px;font-size:0.75rem;cursor:pointer;font-weight:bold;backdrop-filter:blur(8px);}
        .btn-externo:active{transform:scale(0.96);}
        .info-externa{position:fixed;bottom:15px;left:0;right:0;text-align:center;font-size:0.6rem;color:#668;background:rgba(0,0,0,0.5);padding:6px;backdrop-filter:blur(4px);z-index:100;}
        .brillo{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.15),transparent 70%);pointer-events:none;}
        .cta{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:transparent;backdrop-filter:blur(8px);padding:16px 32px;border-radius:60px;font-size:clamp(1.5rem,8vw,2.5rem);font-weight:900;letter-spacing:2px;color:#FFFFFF;text-shadow:4px 4px 12px rgba(0,0,0,0.8),0 0 8px rgba(0,0,0,0.5);white-space:nowrap;z-index:200;pointer-events:none;animation:fadeInOut 3s ease-out forwards;border:1px solid rgba(255,255,255,0.3);font-family:'Impact','Arial Black','Segoe UI',sans-serif;}
        @keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,-50%) scale(0.9);}15%{opacity:1;transform:translate(-50%,-50%) scale(1);}85%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05);visibility:hidden;}}
        .stats-panel{position:fixed;bottom:120px;left:10px;right:10px;background:rgba(0,0,0,0.92);backdrop-filter:blur(10px);border-radius:20px;padding:12px;border:1px solid #4af;z-index:150;transform:translateY(calc(100% + 10px));transition:transform 0.3s ease;max-height:60vh;overflow-y:auto;}
        .stats-panel.visible{transform:translateY(0);}
        .stats-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#ccf;border-bottom:1px solid #4af;padding-bottom:8px;}
        .stats-cerrar{background:none;border:none;color:#f88;font-size:1.2rem;cursor:pointer;}
        .stats-resumen{margin-bottom:10px;padding:8px;background:#1a3a4a;border-radius:12px;font-size:0.7rem;color:#aaf;}
        .stats-lista{font-size:0.7rem;color:#aaf;max-height:200px;overflow-y:auto;}
        .stats-item{padding:5px;border-bottom:1px solid #2a4a6a;}
    </style>
</head>
<body>
<div class="container">
    <div class="cta" id="cta">¿QUÉ QUIERES HOY?</div>
    <div class="scene" id="scene">
        <div class="bola" id="bola">
            <div class="cara front">
                <div class="numero-8"><span>8</span></div>
                <div class="brillo"></div>
            </div>
            <div class="cara back" id="caraBack">
                <div class="triangulo-container">
                    <div class="triangulo">
                        <div class="texto-multifuncional" id="chatTexto" contenteditable="true" role="textbox" aria-multiline="true"></div>
                    </div>
                </div>
                <div class="brillo"></div>
            </div>
        </div>
    </div>
</div>
<div class="botones-externos">
    <button class="btn-externo" id="preguntarBtn">🔮 PREGUNTAR</button>
    <button class="btn-externo" id="microBtn">🎤 HABLAR</button>
    <button class="btn-externo" id="speakerBtn">🔊 LEER</button>
    <button class="btn-externo" id="statsBtn">📊 STATS</button>
</div>
<div class="info-externa">📱 Toca la bola (lado 8) para girar | Citas célebres VERIFICADAS</div>
<div class="stats-panel" id="statsPanel">
    <div class="stats-header"><span>📊 ESTADÍSTICAS</span><button class="stats-cerrar" id="statsCerrar">✕</button></div>
    <div class="stats-resumen" id="statsResumen"></div>
    <div class="stats-lista" id="statsLista"></div>
</div>

<script>
    // ============================================================
    // CITAS CÉLEBRES VERIFICADAS (autores reales)
    // Basadas en fuentes confiables: pensadores, filósofos, escritores
    // ============================================================
    const citasPorTema = {
        amor: [
            "«El amor es una amistad que se enciende.» — Aristóteles (384-322 a.C.)",
            "«Amar es encontrar en la felicidad de otro tu propia felicidad.» — Gottfried Leibniz (1646-1716)",
            "«El amor es la fuerza más humilde, pero la más poderosa que existe.» — Mahatma Gandhi (1869-1948)",
            "«El amor no se mira, se siente.» — Joaquín Sabina (1949- )",
            "«Te quiero no por quien eres, sino por quien soy cuando estoy contigo.» — Gabriel García Márquez (1927-2014)"
        ],
        trabajo: [
            "«Elige un trabajo que te guste y no tendrás que trabajar ni un día de tu vida.» — Confucio (551-479 a.C.)",
            "«El trabajo dignifica.» — Proverbio italiano (popular)",
            "«La única manera de hacer un gran trabajo es amar lo que haces.» — Steve Jobs (1955-2011)",
            "«El éxito en el trabajo no es cuestión de suerte, sino de perseverancia.» — Thomas Edison (1847-1931)"
        ],
        futuro: [
            "«El futuro pertenece a los que creen en la belleza de sus sueños.» — Eleanor Roosevelt (1884-1962)",
            "«El mejor modo de predecir el futuro es creándolo.» — Peter Drucker (1909-2005)",
            "«El futuro no está escrito, no hay destino.» — Robert Zemeckis (1952- ), película 'Back to the Future'",
            "«El futuro tiene muchos nombres: para los débiles es lo inalcanzable; para los temerosos, lo desconocido; para los valientes, la oportunidad.» — Victor Hugo (1802-1885)"
        ],
        dinero: [
            "«El dinero no da la felicidad, pero procura una sensación tan parecida que se necesita un especialista muy sutil para comprobar la diferencia.» — Woody Allen (1935- )",
            "«No es rico el que más tiene, sino el que menos necesita.» — Proverbio popular",
            "«El dinero es un buen siervo pero un mal amo.» — Francis Bacon (1561-1626)",
            "«Gana dinero mientras duermes, o trabajarás hasta que te mueras.» — Warren Buffett (1930- )"
        ],
        familia: [
            "«La familia no es un asunto de sangre, sino de respeto y alegría.» — Richard Bach (1936- )",
            "«La familia es el primer lugar donde aprendemos a amar y ser amados.» — Papa Francisco (1936- )",
            "«La familia es como la rama, los hijos como frutos, todos del mismo árbol.» — Proverbio chino",
            "«El amor de familia es el combustible que nos permite afrontar la vida.» — Juan Pablo II (1920-2005)"
        ],
        amigos: [
            "«Un amigo es alguien que lo sabe todo de ti y aun así te quiere.» — Elbert Hubbard (1856-1915)",
            "«Los amigos son la familia que eliges.» — Jess C. Scott (1978- )",
            "«La amistad duplica las alegrías y divide las angustias.» — Francis Bacon (1561-1626)",
            "«Caminar con un amigo en la oscuridad es mejor que caminar solo en la luz.» — Helen Keller (1880-1968)"
        ],
        exito: [
            "«El éxito no es la clave de la felicidad. La felicidad es la clave del éxito.» — Albert Schweitzer (1875-1965)",
            "«El éxito es aprender a ir de fracaso en fracaso sin desesperarse.» — Winston Churchill (1874-1965)",
            "«El éxito consiste en obtener lo que se desea; la felicidad, en disfrutar lo que se obtiene.» — Ralph Waldo Emerson (1803-1882)",
            "«El 90% del éxito se debe simplemente a presentarse.» — Woody Allen (1935- )"
        ],
        vida: [
            "«La vida es lo que pasa mientras estás haciendo otros planes.» — John Lennon (1940-1980)",
            "«La vida es como una bicicleta, para mantener el equilibrio debes seguir adelante.» — Albert Einstein (1879-1955)",
            "«Vive como si fueras a morir mañana, aprende como si fueras a vivir siempre.» — Mahatma Gandhi (1869-1948)",
            "«No se mide la vida por el número de veces que respiras, sino por los momentos que te dejan sin aliento.» — Maya Angelou (1928-2014)"
        ],
        sabiduria: [
            "«Solo sé que no sé nada.» — Sócrates (470-399 a.C.)",
            "«Pienso, luego existo.» — René Descartes (1596-1650)",
            "«La paciencia es amarga, pero sus frutos son dulces.» — Jean-Jacques Rousseau (1712-1778)",
            "«El sentido común es el menos común de los sentidos.» — Voltaire (1694-1778)",
            "«La verdadera sabiduría está en reconocer la propia ignorancia.» — Sócrates (470-399 a.C.)"
        ]
    };

    // Respuestas extrañas (sin autor falso, son surrealistas pero no se atribuyen a nadie real)
    const respuestasSurrealistas = [
        "«Los pingüinos usan esmoquin porque es el único traje que no les queda grande.» — Sabiduría popular anónima",
        "«Si un libro te aburre, cámbiale el final. Tú eres el lector.» — Refrán moderno",
        "«El tiempo vuela. Tú eres el piloto.» — Proverbio anónimo",
        "«La Luna es un queso. Los astronautas lo confirmaron en secreto.» — Leyenda urbana",
        "«Las nubes no lloran, hacen que la tierra se sienta querida.» — Dicho popular",
        "«El silencio también es una respuesta. A veces la mejor.» — Anónimo",
        "«Los árboles bailan cuando el viento toca su canción favorita.» — Sabiduría popular",
        "«El agua no hierve, se enfada con el fuego.» — Refrán anónimo",
        "«Los calcetines desaparecen porque cumplieron su misión en este plano.» — Teoría doméstica"
    ];

    // Sistema de memoria
    let sesionId = localStorage.getItem('bola8_sesion_id');
    if (!sesionId) {
        sesionId = 'sesion_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        localStorage.setItem('bola8_sesion_id', sesionId);
    }
    let historial = JSON.parse(localStorage.getItem('bola8_historial_' + sesionId)) || [];
    let frasesUsadas = new Set(historial.map(h => h.respuesta));
    let contadorCategorias = JSON.parse(localStorage.getItem('bola8_categorias_' + sesionId)) || {};

    function guardarHistorial() {
        localStorage.setItem('bola8_historial_' + sesionId, JSON.stringify(historial));
        localStorage.setItem('bola8_categorias_' + sesionId, JSON.stringify(contadorCategorias));
    }
    function registrarInteraccion(pregunta, respuesta, categoria) {
        historial.unshift({ timestamp: new Date().toISOString(), pregunta, respuesta, categoria });
        if (historial.length > 50) historial.pop();
        frasesUsadas.add(respuesta);
        contadorCategorias[categoria] = (contadorCategorias[categoria] || 0) + 1;
        guardarHistorial();
        actualizarStatsUI();
    }
    function obtenerCitaSinRepetir(pool) {
        if (!pool.length) return null;
        let candidatas = pool.filter(f => !frasesUsadas.has(f));
        if (!candidatas.length) candidatas = pool;
        return candidatas[Math.floor(Math.random() * candidatas.length)];
    }
    function obtenerCitaPorTema() {
        let todosLosTemas = ['amor', 'trabajo', 'futuro', 'dinero', 'familia', 'amigos', 'exito', 'vida', 'sabiduria'];
        let pool = [];
        for (let tema of todosLosTemas) {
            if (citasPorTema[tema]) pool.push(...citasPorTema[tema]);
        }
        return obtenerCitaSinRepetir(pool);
    }
    function obtenerRespuestaExtrana() { return obtenerCitaSinRepetir(respuestasSurrealistas); }
    function obtenerCategoria(cita) {
        for (let [cat, citas] of Object.entries(citasPorTema)) if (citas.includes(cita)) return cat;
        return 'extrana';
    }

    function actualizarStatsUI() {
        document.getElementById('statsResumen').innerHTML = `<strong>📊 RESUMEN</strong><br>🎱 PREGUNTAS: ${historial.length}<br>💬 CITAS ÚNICAS: ${frasesUsadas.size}`;
        let html = '<strong>📜 ÚLTIMAS PREGUNTAS:</strong><br>';
        historial.slice(0, 10).forEach((item, i) => {
            html += `<div class="stats-item">${i+1}. [${new Date(item.timestamp).toLocaleTimeString()}] "${item.pregunta.substring(0, 35)}..."<br>→ ${item.respuesta.substring(0, 50)}...</div>`;
        });
        document.getElementById('statsLista').innerHTML = html || 'AÚN NO HAY INTERACCIONES.';
    }
    function toggleStats() { document.getElementById('statsPanel').classList.toggle('visible'); actualizarStatsUI(); }

    // Funcionalidad principal
    let reconocimiento = null, grabando = false, girada = false, ultimoAgite = 0, ultimaX = 0, ultimaY = 0, ultimaZ = 0;
    let synth = window.speechSynthesis, vozSeleccionada = null;
    function cargarVoz() { if (synth) { vozSeleccionada = synth.getVoices().find(v => v.lang.startsWith('es')) || null; } }
    if (synth) { synth.onvoiceschanged = cargarVoz; cargarVoz(); }
    function hablar(texto) { if (!synth) return; if (synth.speaking) synth.cancel(); let u = new SpeechSynthesisUtterance(texto); if (vozSeleccionada) u.voice = vozSeleccionada; u.lang = 'es-ES'; u.rate = 0.9; synth.speak(u); }

    const bola = document.getElementById('bola');
    const sceneEl = document.getElementById('scene');
    const caraBack = document.getElementById('caraBack');
    const chatTexto = document.getElementById('chatTexto');
    const preguntarBtn = document.getElementById('preguntarBtn');
    const microBtn = document.getElementById('microBtn');
    const speakerBtn = document.getElementById('speakerBtn');
    const statsBtn = document.getElementById('statsBtn');
    const statsCerrar = document.getElementById('statsCerrar');
    const cta = document.getElementById('cta');

    function ocultarCta() { if (cta && cta.style.visibility !== 'hidden') { cta.style.opacity = '0'; cta.style.visibility = 'hidden'; } }
    function girarBola() { bola.style.transform = 'rotateY(180deg)'; girada = true; }
    function regresarBola() { bola.style.transform = 'rotateY(0deg)'; girada = false; }
    function toggleBola() { girada ? regresarBola() : girarBola(); }
    setTimeout(() => { bola.style.animation = 'none'; bola.style.transform = 'rotateY(0deg)'; }, 1000);

    function mostrarRespuesta(respuesta, pregunta, leer = true) {
        chatTexto.innerText = respuesta;
        registrarInteraccion(pregunta, respuesta, obtenerCategoria(respuesta));
        if (leer) hablar(respuesta);
    }
    function procesarPregunta(texto, leer = true) {
        ocultarCta();
        if (!texto || !texto.trim()) {
            let respuesta = obtenerRespuestaExtrana() || respuestasSurrealistas[0];
            mostrarRespuesta(respuesta, "[pregunta vacía]", leer);
            if (!girada) girarBola();
            setTimeout(() => regresarBola(), 3800);
            return;
        }
        let respuesta = obtenerCitaPorTema() || citasPorTema.sabiduria[0];
        mostrarRespuesta(respuesta, texto, leer);
        if (!girada) girarBola();
        setTimeout(() => regresarBola(), 3800);
    }
    function respuestaAleatoria() {
        ocultarCta();
        let esExtrana = Math.random() < 0.3;
        let respuesta = esExtrana ? (obtenerRespuestaExtrana() || respuestasSurrealistas[0]) : (obtenerCitaPorTema() || citasPorTema.sabiduria[0]);
        mostrarRespuesta(respuesta, "[aleatorio: agitado]", true);
        if (!girada) girarBola();
        setTimeout(() => regresarBola(), 3800);
    }
    function leerTextoActual() { let t = chatTexto.innerText; if (t && t.trim()) hablar(t); else { let s = "ESCRIBE UNA PREGUNTA PRIMERO"; chatTexto.innerText = s; hablar(s); } }

    function iniciarMicrofono() {
        if (!('webkitSpeechRecognition' in window)) { chatTexto.innerText = "❌ VOZ NO SOPORTADA"; return; }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        reconocimiento = new SpeechRecognition();
        reconocimiento.lang = 'es-ES';
        reconocimiento.onstart = () => { grabando = true; microBtn.textContent = '🔴...'; chatTexto.innerText = "🎤 ESCUCHANDO..."; };
        reconocimiento.onresult = (e) => { let texto = e.results[0][0].transcript; chatTexto.innerText = texto; procesarPregunta(texto, true); detenerMicrofono(); };
        reconocimiento.onerror = () => detenerMicrofono();
        reconocimiento.onend = () => detenerMicrofono();
        reconocimiento.start();
    }
    function detenerMicrofono() { if (reconocimiento) try { reconocimiento.stop(); } catch(e) {} grabando = false; microBtn.textContent = '🎤 HABLAR'; if (chatTexto.innerText === "🎤 ESCUCHANDO...") chatTexto.innerText = ""; }
    function toggleMicrofono() { grabando ? detenerMicrofono() : iniciarMicrofono(); }

    function iniciarDeteccionMovimiento() {
        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', (e) => {
                let ahora = Date.now();
                if (ahora - ultimoAgite < 800) return;
                let acc = e.accelerationIncludingGravity;
                if (!acc) return;
                let fuerza = Math.abs((acc.x||0)-ultimaX) + Math.abs((acc.y||0)-ultimaY) + Math.abs((acc.z||0)-ultimaZ);
                if (fuerza > 25) { ultimoAgite = ahora; respuestaAleatoria(); }
                ultimaX = acc.x||0; ultimaY = acc.y||0; ultimaZ = acc.z||0;
            });
        }
    }
    function solicitarPermisoMovimiento() {
        if (typeof DeviceMotionEvent.requestPermission === 'function') { DeviceMotionEvent.requestPermission().then(r => { if (r === 'granted') iniciarDeteccionMovimiento(); }); }
        else iniciarDeteccionMovimiento();
    }

    sceneEl.addEventListener('click', (e) => { if (e.target === caraBack || caraBack.contains(e.target)) { if (girada) chatTexto.focus(); } else { toggleBola(); } });
    preguntarBtn.addEventListener('click', () => procesarPregunta(chatTexto.innerText, true));
    microBtn.addEventListener('click', toggleMicrofono);
    speakerBtn.addEventListener('click', leerTextoActual);
    statsBtn.addEventListener('click', toggleStats);
    statsCerrar.addEventListener('click', toggleStats);
    chatTexto.addEventListener('focus', ocultarCta);
    document.body.addEventListener('touchstart', ocultarCta);
    document.body.addEventListener('click', ocultarCta);

    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
        let btn = document.createElement('div');
        btn.innerText = '🎯 ACTIVAR AGITADO';
        btn.style.cssText = 'position:fixed;bottom:55px;left:50%;transform:translateX(-50%);background:#2a4a6a;color:#ccf;padding:6px 12px;border-radius:30px;font-size:0.65rem;z-index:100;cursor:pointer';
        btn.onclick = solicitarPermisoMovimiento;
        document.body.appendChild(btn);
    } else if (window.DeviceMotionEvent) iniciarDeteccionMovimiento();

    chatTexto.innerText = "ESCRIBE TU PREGUNTA...";
    setTimeout(() => { if (chatTexto.innerText === "ESCRIBE TU PREGUNTA...") chatTexto.innerText = ""; }, 2500);
</script>
</body>
</html>
