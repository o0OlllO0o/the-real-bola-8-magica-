<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#111111">
    <title>🎱 Bola Mágica 8</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #1a1a2e, #050510);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            padding: 16px;
        }

        /* Contenedor centrado */
        .container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
        }

        /* Escena 3D - bola grande */
        .scene {
            width: min(85vw, 85vh, 450px);
            height: min(85vw, 85vh, 450px);
            position: relative;
            cursor: pointer;
        }

        /* Esfera que rota */
        .sphere {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateIn 1.2s ease-out;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 50%;
        }

        @keyframes rotateIn {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            100% { transform: rotateY(360deg) rotateX(10deg); }
        }

        /* Caras de la esfera */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 -25px 35px rgba(0,0,0,0.6), inset 0 25px 30px rgba(255,255,255,0.1), 0 20px 30px rgba(0,0,0,0.5);
        }

        /* Cara frontal: número 8 clásico */
        .face.front {
            background: radial-gradient(circle at 35% 35%, #2a2a2a, #080808);
            transform: rotateY(0deg);
        }

        .number-8 {
            width: 45%;
            height: 45%;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5), inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .number-8 span {
            font-size: clamp(3rem, 15vw, 6rem);
            font-weight: 900;
            color: #111;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        /* Cara trasera: triángulo invertido REAL (vértice ARRIBA) */
        .face.back {
            background: radial-gradient(circle at 35% 35%, #1a2a2a, #0a0a1a);
            transform: rotateY(180deg);
            flex-direction: column;
            padding: 12%;
        }

        /* Triángulo con vértice arriba, base abajo */
        .triangle-real {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #0a1a2a, #051015);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20% 12% 15% 12%;
            border: 1px solid rgba(80, 180, 255, 0.3);
            box-shadow: inset 0 0 25px rgba(0, 80, 160, 0.2), 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Área de respuesta */
        .answer-area {
            width: 100%;
            text-align: center;
            margin-bottom: 15%;
        }

        .frase {
            color: #d4eaff;
            font-size: clamp(0.75rem, 4vw, 1rem);
            line-height: 1.4;
            font-style: italic;
            text-shadow: 0 0 4px rgba(80, 180, 255, 0.3);
            font-weight: 500;
            word-break: break-word;
        }

        .autor {
            color: #8ab3cc;
            font-size: clamp(0.6rem, 3vw, 0.75rem);
            margin-top: 8px;
            border-top: 1px solid rgba(80, 180, 255, 0.3);
            padding-top: 6px;
        }

        /* Campo de texto dentro del triángulo */
        .input-area-triangle {
            width: 100%;
            margin-top: 5%;
        }

        .input-area-triangle input {
            width: 100%;
            padding: 12px 10px;
            border-radius: 50px;
            border: none;
            background: rgba(25, 45, 65, 0.9);
            color: #fff;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
            text-align: center;
            outline: none;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }

        .input-area-triangle input::placeholder {
            color: #8ab3cc;
            font-style: italic;
        }

        /* Botones dentro del triángulo (solo los esenciales) */
        .buttons-minimal {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            justify-content: center;
        }

        .btn-minimal {
            background: #2a4a6a;
            border: none;
            color: #cceeff;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: clamp(0.65rem, 3vw, 0.75rem);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-minimal:active { transform: scale(0.96); }

        .micro-btn {
            background: #3a5a7a;
        }

        .micro-btn.grabando {
            background: #a33;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* Estado (mensajes sutiles) */
        .estado-sutil {
            font-size: clamp(0.55rem, 2.5vw, 0.65rem);
            color: #8ab3cc;
            margin-top: 12px;
            text-align: center;
            opacity: 0.8;
        }

        /* Instrucción de agitado fuera de la bola */
        .info-externa {
            position: fixed;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.6rem;
            color: #668;
            background: rgba(0,0,0,0.5);
            padding: 6px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="scene" id="scene">
        <div class="sphere" id="sphere">
            <!-- Cara frontal: número 8 -->
            <div class="face front">
                <div class="number-8"><span>8</span></div>
            </div>
            <!-- Cara trasera: triángulo invertido real (vértice arriba) -->
            <div class="face back">
                <div class="triangle-real">
                    <div class="answer-area">
                        <div class="frase" id="frase">🎱 Pregúntame...</div>
                        <div class="autor" id="autor">— Bola Mágica 8</div>
                    </div>
                    <div class="input-area-triangle">
                        <input type="text" id="preguntaInput" placeholder="Escribe tu pregunta..." autocomplete="off">
                    </div>
                    <div class="buttons-minimal">
                        <button class="btn-minimal" id="preguntarBtn">🔮 Preguntar</button>
                        <button class="btn-minimal micro-btn" id="microBtn">🎤 Hablar</button>
                    </div>
                    <div class="estado-sutil" id="estadoMsg"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="info-externa" id="infoExterna">📱 Toca la bola para girarla | Agita para respuesta aleatoria</div>

<script>
    // ============================================================
    // BASE DE DATOS DE FRASES (con temas ocultos pero activos)
    // ============================================================
    const frasesPorTema = {
        amor: ["«Amar es encontrar en la felicidad de otro tu propia felicidad.» — Leibniz","«El amor no se mira, se siente.» — Sabina","«Te quiero no por quien eres, sino por quien soy cuando estoy contigo.» — García Márquez"],
        trabajo: ["«Elige un trabajo que te guste y no trabajarás ni un día.» — Confucio","«El 90% del éxito es presentarse.» — Woody Allen","«La única manera de hacer un gran trabajo es amar lo que haces.» — Steve Jobs"],
        futuro: ["«El futuro pertenece a los que creen en sus sueños.» — Eleanor Roosevelt","«El mejor modo de predecir el futuro es creándolo.» — Peter Drucker","«El futuro no está escrito, somos nosotros quienes lo creamos.»"],
        dinero: ["«El dinero no trae la felicidad, pero la compra.»","«No es rico el que más tiene, sino el que menos necesita.»","«Gana dinero mientras duermes, o trabajarás hasta que te mueras.» — Buffett"],
        familia: ["«La familia no es cuestión de sangre, sino de respeto y alegría.» — Bach","«La familia te quiere sin preguntar.»","«La familia es donde aprendemos a amar.» — Papa Francisco"],
        amigos: ["«Un amigo es quien lo sabe todo de ti y aún así te quiere.» — Hubbard","«Los amigos son la familia que eliges.» — Scott","«La amistad duplica las alegrías y divide las angustias.» — Bacon"],
        exito: ["«El éxito no es la clave de la felicidad. La felicidad es la clave del éxito.» — Schweitzer","«El éxito es ir de fracaso en fracaso sin desesperarse.» — Churchill","«El éxito es obtener lo que deseas; la felicidad, disfrutarlo.» — Emerson"],
        vida: ["«La vida es lo que pasa mientras haces otros planes.» — John Lennon","«La vida es como una bicicleta: para mantener el equilibrio, sigue adelante.» — Einstein","«Vive como si fueras a morir mañana, aprende como si fueras a vivir siempre.» — Gandhi"]
    };
    const frasesGenerales = ["«La sabiduría comienza en la reflexión.» — Sócrates","«Solo sé que no sé nada.» — Sócrates","«Pienso, luego existo.» — Descartes","«El sentido común es el menos común de los sentidos.» — Voltaire"];

    // Temas activos (sin interfaz visible, pero funcionales)
    let temasActivos = ['amor', 'trabajo', 'futuro', 'dinero', 'familia', 'amigos', 'exito', 'vida'];

    let reconocimiento = null;
    let grabando = false;
    let girada = false;
    let ultimoAgite = 0;
    let ultimaX = 0, ultimaY = 0, ultimaZ = 0;

    // Elementos DOM
    const sphere = document.getElementById('sphere');
    const scene = document.getElementById('scene');
    const fraseDiv = document.getElementById('frase');
    const autorDiv = document.getElementById('autor');
    const preguntaInput = document.getElementById('preguntaInput');
    const preguntarBtn = document.getElementById('preguntarBtn');
    const microBtn = document.getElementById('microBtn');
    const estadoMsg = document.getElementById('estadoMsg');

    // ============================================================
    // BOLA 3D
    // ============================================================
    function girarBola() { sphere.style.transform = 'rotateY(180deg) rotateX(0deg)'; girada = true; }
    function regresarBola() { sphere.style.transform = 'rotateY(0deg) rotateX(0deg)'; girada = false; }
    function toggleBola() { girada ? regresarBola() : girarBola(); }

    setTimeout(() => { sphere.style.animation = 'none'; sphere.style.transform = 'rotateY(0deg) rotateX(0deg)'; }, 1200);

    // ============================================================
    // RESPUESTAS
    // ============================================================
    function obtenerRespuesta() {
        let pool = [];
        for (let tema of temasActivos) {
            if (frasesPorTema[tema]) pool.push(...frasesPorTema[tema]);
        }
        if (pool.length === 0) pool = frasesGenerales;
        return pool[Math.floor(Math.random() * pool.length)];
    }

    function mostrarRespuesta(respuesta) {
        const partes = respuesta.split(' — ');
        fraseDiv.innerHTML = partes[0];
        autorDiv.innerHTML = '— ' + (partes[1] || 'Bola Mágica 8');
        estadoMsg.innerHTML = '✨';
        setTimeout(() => { if (estadoMsg.innerHTML === '✨') estadoMsg.innerHTML = ''; }, 1500);
    }

    function procesarPregunta(texto) {
        if (!texto.trim()) {
            estadoMsg.innerHTML = '❓';
            setTimeout(() => { if (estadoMsg.innerHTML === '❓') estadoMsg.innerHTML = ''; }, 1000);
            return;
        }
        const respuesta = obtenerRespuesta();
        mostrarRespuesta(respuesta);
        preguntaInput.value = '';
        if (!girada) girarBola();
        setTimeout(() => regresarBola(), 3500);
    }

    function respuestaAleatoria() {
        const respuesta = obtenerRespuesta();
        mostrarRespuesta(respuesta);
        if (!girada) girarBola();
        setTimeout(() => regresarBola(), 3500);
    }

    // ============================================================
    // MICRÓFONO
    // ============================================================
    function iniciarMicrofono() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            estadoMsg.innerHTML = '❌ Voz no soportada';
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        reconocimiento = new SpeechRecognition();
        reconocimiento.lang = 'es-ES';
        reconocimiento.continuous = false;
        reconocimiento.interimResults = false;
        reconocimiento.onstart = () => {
            grabando = true;
            microBtn.classList.add('grabando');
            microBtn.textContent = '🔴...';
            estadoMsg.innerHTML = '🎤';
        };
        reconocimiento.onresult = (event) => {
            const texto = event.results[0][0].transcript;
            preguntaInput.value = texto;
            procesarPregunta(texto);
            detenerMicrofono();
        };
        reconocimiento.onerror = () => { estadoMsg.innerHTML = '❌'; detenerMicrofono(); };
        reconocimiento.onend = () => detenerMicrofono();
        reconocimiento.start();
    }

    function detenerMicrofono() {
        if (reconocimiento) try { reconocimiento.stop(); } catch(e) {}
        grabando = false;
        microBtn.classList.remove('grabando');
        microBtn.textContent = '🎤';
        if (estadoMsg.innerHTML === '🎤') estadoMsg.innerHTML = '';
    }

    function toggleMicrofono() { grabando ? detenerMicrofono() : iniciarMicrofono(); }

    // ============================================================
    // AGITADO
    // ============================================================
    function iniciarDeteccionMovimiento() {
        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', (e) => {
                const ahora = Date.now();
                if (ahora - ultimoAgite < 800) return;
                const acc = e.accelerationIncludingGravity;
                if (!acc) return;
                const x = acc.x || 0, y = acc.y || 0, z = acc.z || 0;
                const fuerza = Math.abs(x - ultimaX) + Math.abs(y - ultimaY) + Math.abs(z - ultimaZ);
                if (fuerza > 25) { ultimoAgite = ahora; respuestaAleatoria(); }
                ultimaX = x; ultimaY = y; ultimaZ = z;
            });
            document.getElementById('infoExterna').innerHTML = '📱 Agita la bola para respuesta aleatoria';
        }
    }

    function solicitarPermisoMovimiento() {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission().then(r => { if (r === 'granted') iniciarDeteccionMovimiento(); });
        } else iniciarDeteccionMovimiento();
    }

    // ============================================================
    // EVENTOS
    // ============================================================
    scene.addEventListener('click', toggleBola);
    preguntarBtn.addEventListener('click', () => procesarPregunta(preguntaInput.value));
    preguntaInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') procesarPregunta(preguntaInput.value); });
    microBtn.addEventListener('click', toggleMicrofono);

    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
        const btnPermiso = document.createElement('div');
        btnPermiso.innerText = '🎯 Activar agitado';
        btnPermiso.style.position = 'fixed';
        btnPermiso.style.bottom = '50px';
        btnPermiso.style.left = '50%';
        btnPermiso.style.transform = 'translateX(-50%)';
        btnPermiso.style.background = '#2a4a6a';
        btnPermiso.style.color = '#ccf';
        btnPermiso.style.padding = '6px 12px';
        btnPermiso.style.borderRadius = '30px';
        btnPermiso.style.fontSize = '0.65rem';
        btnPermiso.style.zIndex = '100';
        btnPermiso.style.cursor = 'pointer';
        btnPermiso.onclick = solicitarPermisoMovimiento;
        document.body.appendChild(btnPermiso);
        document.getElementById('infoExterna').innerHTML = '📱 Toca "Activar agitado" para usar el giroscopio';
    } else if (window.DeviceMotionEvent) {
        iniciarDeteccionMovimiento();
    }
</script>
</body>
</html>
