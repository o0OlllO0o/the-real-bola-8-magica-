<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#111111">
    <title>🎱 Bola Mágica 8 Esférica</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{font-family:'Segoe UI','Helvetica Neue',sans-serif;min-height:100vh;background:linear-gradient(145deg,#2a2a2a 0%,#0a0a0a 100%);display:flex;justify-content:center;align-items:center;padding:16px;}
        .app{max-width:500px;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;}
        
        /* Contenedor 3D con perspectiva */
        .escena-3d{width:280px;height:280px;perspective:1200px;margin:20px auto;cursor:pointer;}
        .bola-3d{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.8s cubic-bezier(0.4,0.2,0.2,1);border-radius:50%;box-shadow:0 20px 30px rgba(0,0,0,0.5);}
        
        /* Caras */
        .cara{position:absolute;width:100%;height:100%;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -15px 20px rgba(0,0,0,0.4),inset 0 15px 20px rgba(255,255,255,0.1);}
        
        /* Frontal: número 8 */
        .frontal{background:radial-gradient(circle at 35% 35%,#2a2a2a,#0a0a0a);transform:rotateY(0deg);}
        .circulo-blanco{width:120px;height:120px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 15px rgba(0,0,0,0.3),inset 0 2px 5px rgba(0,0,0,0.1);}
        .circulo-blanco span{font-size:5rem;font-weight:900;color:#111;font-family:'Impact','Arial Black',sans-serif;text-shadow:2px 2px 0 rgba(0,0,0,0.2);}
        
        /* Trasera: triángulo respuesta */
        .trasera{background:radial-gradient(circle at 35% 35%,#2a2a2a,#0a0a0a);transform:rotateY(180deg);flex-direction:column;}
        .triangulo{width:90%;background:linear-gradient(145deg,#1a2a3a,#0a1a2a);clip-path:polygon(50% 0%,0% 100%,100% 100%);padding:40px 15px 25px 15px;text-align:center;border:1px solid rgba(100,200,255,0.3);}
        .texto-respuesta{color:#ccf;font-size:0.85rem;line-height:1.4;font-style:italic;min-height:70px;display:flex;align-items:center;justify-content:center;text-shadow:0 0 3px rgba(0,255,255,0.3);}
        .autor-respuesta{color:#8ab;font-size:0.7rem;margin-top:10px;border-top:1px solid rgba(100,200,255,0.3);padding-top:8px;}
        
        /* Giro esférico (se activa al hacer clic) */
        .girado{transform:rotateY(180deg);}
        
        /* Efecto de brillo adicional (opcional) */
        .brillo{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.2),transparent 70%);pointer-events:none;}
        
        /* Resto de estilos (filtros, chat, etc.) */
        .filtros-acumulador{background:rgba(0,0,0,0.6);border-radius:20px;padding:12px;margin:15px 0;backdrop-filter:blur(8px);border:1px solid #444;width:100%;}
        .filtros-titulo{font-size:0.7rem;text-transform:uppercase;color:#aaa;margin-bottom:8px;}
        .filtros-lista{display:flex;flex-wrap:wrap;gap:8px;}
        .filtro-tag{background:#222;padding:5px 12px;border-radius:20px;font-size:0.75rem;display:inline-flex;align-items:center;gap:8px;color:#ddd;border:1px solid #555;}
        .filtro-tag .remove{background:none;border:none;color:#f66;cursor:pointer;font-size:1rem;}
        .chat-area{background:rgba(0,0,0,0.5);border-radius:20px;padding:15px;margin:15px 0;max-height:280px;overflow-y:auto;backdrop-filter:blur(4px);width:100%;}
        .chat-mensaje{padding:10px 14px;margin-bottom:10px;border-radius:18px;font-size:0.85rem;}
        .chat-mensaje.bot{background:#1e2a2a;color:#ccf;border-left:3px solid #4af;}
        .chat-mensaje.usuario{background:#2a2e3a;color:#ffd;text-align:right;border-right:3px solid #fa4;}
        .sugerencias{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;}
        .sugerencia-btn{background:#2a3a4a;border:1px solid #4af;color:#ccf;padding:6px 14px;border-radius:30px;font-size:0.75rem;cursor:pointer;}
        .input-area{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;width:100%;}
        input{flex:1;padding:12px;border-radius:40px;border:1px solid #555;background:#1a1a2a;color:#fff;font-size:0.9rem;outline:none;}
        button{background:#2a3a4a;border:1px solid #4af;color:#ccf;padding:10px 18px;border-radius:40px;cursor:pointer;font-weight:bold;}
        .microfono-btn.grabando{background:#a33;border-color:#f88;}
        .shake-hint{text-align:center;font-size:0.7rem;color:#888;margin-top:12px;}
        .permisos-panel{display:flex;gap:10px;justify-content:center;margin-bottom:10px;width:100%;}
        .permiso-btn{background:#2a3a4a;padding:5px 12px;border-radius:20px;font-size:0.7rem;cursor:pointer;color:#ccf;}
    </style>
</head>
<body>
<div class="app">
    <div class="escena-3d" id="escena3d">
        <div class="bola-3d" id="bola3d">
            <div class="cara frontal">
                <div class="circulo-blanco"><span>8</span></div>
                <div class="brillo"></div>
            </div>
            <div class="cara trasera">
                <div class="triangulo">
                    <div class="texto-respuesta" id="respuestaTexto">🎱 Haz una pregunta</div>
                    <div class="autor-respuesta" id="respuestaAutor">— Bola Mágica 8</div>
                </div>
                <div class="brillo"></div>
            </div>
        </div>
    </div>

    <div class="permisos-panel" id="permisosPanel">
        <div class="permiso-btn" id="permisoMicrofonoBtn">🎤 Activar micrófono</div>
        <div class="permiso-btn" id="permisoMovimientoBtn" style="display:none;">📱 Activar agitado</div>
    </div>

    <div class="filtros-acumulador" id="filtrosAcumulador" style="display:none;">
        <div class="filtros-titulo">🎯 Filtros activos (toca ✕ para eliminar):</div>
        <div class="filtros-lista" id="filtrosLista"></div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="chat-mensaje bot">🎱 ¡Bienvenido! Toca la bola para girarla en 3D como una esfera real.</div>
        <div class="sugerencias" id="sugerencias"></div>
    </div>

    <div class="input-area">
        <input type="text" id="pregunta" placeholder="Escribe tu pregunta..." autocomplete="off">
        <button id="enviarBtn">🎱 Preguntar</button>
        <button id="microfonoBtn" class="microfono-btn">🎤 Hablar</button>
    </div>
    <div class="shake-hint" id="shakeHint">📱 Toca la bola para girarla (o agita el móvil)</div>
    <div class="activar-shake" id="activarShakeBtn" style="display:none;">🎯 Tocar para activar agitado (iOS)</div>
</div>

<script>
    // ============================================================
    // FRASES CÉLEBRES
    // ============================================================
    const respuestasPorFiltro = {
        amor: ["«Amar es encontrar en la felicidad de otro tu propia felicidad.» — Leibniz","«El amor no se mira, se siente.» — Sabina","«Te quiero no por quien eres, sino por quien soy cuando estoy contigo.» — García Márquez"],
        trabajo: ["«Elige un trabajo que te guste y no trabajarás ni un día.» — Confucio","«El 90% del éxito es presentarse.» — Woody Allen","«La única manera de hacer un gran trabajo es amar lo que haces.» — Steve Jobs"],
        futuro: ["«El futuro pertenece a los que creen en sus sueños.» — Eleanor Roosevelt","«El mejor modo de predecir el futuro es creándolo.» — Peter Drucker","«El futuro no está escrito, somos nosotros quienes lo creamos.»"],
        dinero: ["«El dinero no trae la felicidad, pero la compra.»","«No es rico el que más tiene, sino el que menos necesita.»","«Gana dinero mientras duermes, o trabajarás hasta que te mueras.» — Buffett"],
        familia: ["«La familia no es cuestión de sangre, sino de respeto y alegría.» — Bach","«La familia te quiere sin preguntar.»","«La familia es donde aprendemos a amar.» — Papa Francisco"],
        amigos: ["«Un amigo es quien lo sabe todo de ti y aún así te quiere.» — Hubbard","«Los amigos son la familia que eliges.» — Scott","«La amistad duplica las alegrías y divide las angustias.» — Bacon"],
        exito: ["«El éxito no es la clave de la felicidad. La felicidad es la clave del éxito.» — Schweitzer","«El éxito es ir de fracaso en fracaso sin desesperarse.» — Churchill","«El éxito es obtener lo que deseas; la felicidad, disfrutarlo.» — Emerson"],
        vida: ["«La vida es lo que pasa mientras haces otros planes.» — John Lennon","«La vida es como una bicicleta: para mantener el equilibrio, sigue adelante.» — Einstein","«Vive como si fueras a morir mañana, aprende como si fueras a vivir siempre.» — Gandhi"]
    };
    const respuestasGenerales = ["«La sabiduría comienza en la reflexión.» — Sócrates","«Solo sé que no sé nada.» — Sócrates","«Pienso, luego existo.» — Descartes","«El sentido común es el menos común de los sentidos.» — Voltaire"];

    let filtrosActivos = [];
    let reconocimiento = null;
    let grabando = false;
    let ultimoAgite = 0;
    let ultimaX=0, ultimaY=0, ultimaZ=0;
    let girada = false;

    const escena3d = document.getElementById('escena3d');
    const bola3d = document.getElementById('bola3d');
    const respuestaTexto = document.getElementById('respuestaTexto');
    const respuestaAutor = document.getElementById('respuestaAutor');
    const filtrosAcumulador = document.getElementById('filtrosAcumulador');
    const filtrosLista = document.getElementById('filtrosLista');
    const chatArea = document.getElementById('chatArea');
    const sugerenciasDiv = document.getElementById('sugerencias');
    const inputPregunta = document.getElementById('pregunta');
    const enviarBtn = document.getElementById('enviarBtn');
    const microfonoBtn = document.getElementById('microfonoBtn');
    const shakeHint = document.getElementById('shakeHint');
    const activarShakeBtn = document.getElementById('activarShakeBtn');
    const permisoMicrofonoBtn = document.getElementById('permisoMicrofonoBtn');
    const permisoMovimientoBtn = document.getElementById('permisoMovimientoBtn');

    function girarBola() { bola3d.classList.add('girado'); girada = true; }
    function regresarBola() { bola3d.classList.remove('girado'); girada = false; }
    function toggleBola() { girada ? regresarBola() : girarBola(); }

    function obtenerRespuesta() {
        let opciones = [];
        for (let f of filtrosActivos) if (respuestasPorFiltro[f]) opciones.push(...respuestasPorFiltro[f]);
        if (opciones.length === 0) opciones = respuestasGenerales;
        return opciones[Math.floor(Math.random() * opciones.length)];
    }

    function actualizarUI(respuesta) {
        const partes = respuesta.split(' — ');
        respuestaTexto.innerHTML = partes[0];
        respuestaAutor.innerHTML = '— ' + (partes[1] || 'Bola Mágica 8');
    }

    function procesarPregunta(texto) {
        if (!texto.trim()) return;
        const respuesta = obtenerRespuesta();
        actualizarUI(respuesta);
        agregarMensaje(`❓ "${texto}"`, true);
        agregarMensaje(respuesta, false);
        inputPregunta.value = '';
        if (!girada) girarBola();
        setTimeout(() => regresarBola(), 3000);
    }

    function agitarAleatorio() {
        const respuesta = obtenerRespuesta();
        actualizarUI(respuesta);
        agregarMensaje(`🎲 Sabiduría aleatoria:`, false);
        agregarMensaje(respuesta, false);
        if (!girada) girarBola();
        setTimeout(() => regresarBola(), 3000);
    }

    function agregarMensaje(texto, esUsuario = false) {
        const msg = document.createElement('div');
        msg.className = `chat-mensaje ${esUsuario ? 'usuario' : 'bot'}`;
        msg.textContent = texto;
        chatArea.insertBefore(msg, sugerenciasDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function actualizarFiltrosUI() {
        if (filtrosActivos.length === 0) { filtrosAcumulador.style.display = 'none'; return; }
        filtrosAcumulador.style.display = 'block';
        filtrosLista.innerHTML = '';
        filtrosActivos.forEach(f => {
            const tag = document.createElement('div');
            tag.className = 'filtro-tag';
            tag.innerHTML = `${f} <button class="remove" data-filtro="${f}">✕</button>`;
            filtrosLista.appendChild(tag);
        });
        document.querySelectorAll('.remove').forEach(btn => {
            btn.addEventListener('click', (e) => {
                filtrosActivos = filtrosActivos.filter(f => f !== btn.dataset.filtro);
                actualizarFiltrosUI();
                regenerarSugerencias();
            });
        });
    }

    function regenerarSugerencias() {
        sugerenciasDiv.innerHTML = '';
        const todos = ['amor', 'trabajo', 'futuro', 'dinero', 'familia', 'amigos', 'exito', 'vida'];
        const disponibles = todos.filter(f => !filtrosActivos.includes(f));
        if (disponibles.length === 0) { sugerenciasDiv.innerHTML = '<span style="opacity:0.6;">✅ Todos los temas activados.</span>'; return; }
        const nombres = {amor:'💕 Amor', trabajo:'💼 Trabajo', futuro:'🔮 Futuro', dinero:'💰 Dinero', familia:'👪 Familia', amigos:'👥 Amigos', exito:'🏆 Éxito', vida:'🌿 Vida'};
        disponibles.forEach(f => {
            const btn = document.createElement('button');
            btn.className = 'sugerencia-btn';
            btn.textContent = nombres[f];
            btn.addEventListener('click', () => {
                if (!filtrosActivos.includes(f)) {
                    filtrosActivos.push(f);
                    actualizarFiltrosUI();
                    agregarMensaje(`✅ Añadido tema: ${nombres[f]}`);
                    regenerarSugerencias();
                }
            });
            sugerenciasDiv.appendChild(btn);
        });
    }

    // Microfono
    function iniciarMicrofono() {
        if (!('webkitSpeechRecognition' in window)) { agregarMensaje("❌ No soporta voz."); return; }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        reconocimiento = new SpeechRecognition();
        reconocimiento.lang = 'es-ES';
        reconocimiento.onstart = () => { grabando = true; microfonoBtn.classList.add('grabando'); microfonoBtn.textContent = '🔴 Grabando...'; };
        reconocimiento.onresult = (e) => { procesarPregunta(e.results[0][0].transcript); detenerMicrofono(); };
        reconocimiento.onerror = () => detenerMicrofono();
        reconocimiento.onend = () => detenerMicrofono();
        reconocimiento.start();
    }
    function detenerMicrofono() { if (reconocimiento) try { reconocimiento.stop(); } catch(e) {} grabando = false; microfonoBtn.classList.remove('grabando'); microfonoBtn.textContent = '🎤 Hablar'; }
    function toggleMicrofono() { grabando ? detenerMicrofono() : iniciarMicrofono(); }

    // Movimiento
    function iniciarDeteccionMovimiento() {
        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', (e) => {
                const ahora = Date.now();
                if (ahora - ultimoAgite < 800) return;
                const acc = e.accelerationIncludingGravity;
                if (!acc) return;
                const fuerza = Math.abs((acc.x||0)-ultimaX) + Math.abs((acc.y||0)-ultimaY) + Math.abs((acc.z||0)-ultimaZ);
                if (fuerza > 25) { ultimoAgite = ahora; agitarAleatorio(); }
                ultimaX = acc.x||0; ultimaY = acc.y||0; ultimaZ = acc.z||0;
            });
            shakeHint.textContent = "📱 ¡Agitado activado! Agita la bola";
        }
    }
    function solicitarPermisoMovimiento() {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission().then(r => { if (r === 'granted') iniciarDeteccionMovimiento(); });
        } else iniciarDeteccionMovimiento();
    }
    function solicitarPermisoMicrofono() {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(() => { agregarMensaje("✅ Micrófono activado."); permisoMicrofonoBtn.style.display = 'none'; });
    }

    // Eventos
    escena3d.addEventListener('click', toggleBola);
    enviarBtn.addEventListener('click', () => procesarPregunta(inputPregunta.value));
    inputPregunta.addEventListener('keypress', (e) => { if (e.key === 'Enter') procesarPregunta(inputPregunta.value); });
    microfonoBtn.addEventListener('click', toggleMicrofono);
    permisoMicrofonoBtn.addEventListener('click', solicitarPermisoMicrofono);

    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
        activarShakeBtn.style.display = 'block';
        permisoMovimientoBtn.style.display = 'block';
        activarShakeBtn.addEventListener('click', solicitarPermisoMovimiento);
        permisoMovimientoBtn.addEventListener('click', solicitarPermisoMovimiento);
    } else if (window.DeviceMotionEvent) iniciarDeteccionMovimiento();

    actualizarFiltrosUI();
    regenerarSugerencias();
    agregarMensaje("🎱 Toca la bola: ahora gira como una ESFERA 3D real, como si la dieras la vuelta en el espacio.");
</script>
</body>
</html>
