<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#111111">
    <title>🎱 Bola Mágica 8</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #1a1a2e, #050510);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            padding: 16px;
        }

        .container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Escena */
        .scene {
            width: min(85vw, 85vh, 420px);
            height: min(85vw, 85vh, 420px);
            position: relative;
            cursor: pointer;
        }

        /* Contenedor de las dos caras */
        .bola {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 50%;
            animation: rotateIn 1s ease-out;
        }

        @keyframes rotateIn {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* Caras */
        .cara {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 -25px 35px rgba(0,0,0,0.5), inset 0 25px 30px rgba(255,255,255,0.1), 0 20px 30px rgba(0,0,0,0.4);
        }

        /* Cara frontal: número 8 */
        .cara.front {
            background: radial-gradient(circle at 35% 35%, #2a2a2a, #080808);
            transform: rotateY(0deg);
        }

        .numero-8 {
            width: 45%;
            height: 45%;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .numero-8 span {
            font-size: clamp(2.5rem, 12vw, 5rem);
            font-weight: 900;
            color: #111;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        /* Cara trasera: triángulo con vértice ABAJO */
        .cara.back {
            background: radial-gradient(circle at 35% 35%, #1a2a2a, #0a0a1a);
            transform: rotateY(180deg);
            padding: 8%;
        }

        /* Triángulo correcto: base arriba, vértice abajo */
        .triangulo {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #0a1a2a, #051015);
            clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15% 10% 18% 10%;
            border: 1px solid rgba(80, 180, 255, 0.4);
            box-shadow: inset 0 0 25px rgba(0, 80, 160, 0.2), 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Contenido dentro del triángulo */
        .contenido-triangulo {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .respuesta {
            width: 100%;
            text-align: center;
            margin-bottom: 8px;
        }

        .frase {
            color: #d4eaff;
            font-size: clamp(0.65rem, 3.5vw, 0.85rem);
            line-height: 1.4;
            font-style: italic;
            text-shadow: 0 0 3px rgba(80, 180, 255, 0.3);
            word-break: break-word;
        }

        .autor {
            color: #8ab3cc;
            font-size: clamp(0.55rem, 2.5vw, 0.65rem);
            margin-top: 5px;
            border-top: 1px solid rgba(80, 180, 255, 0.3);
            padding-top: 5px;
        }

        .input-grupo {
            width: 100%;
            margin-top: 5px;
        }

        .input-grupo input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 30px;
            border: none;
            background: rgba(25, 45, 65, 0.95);
            color: #fff;
            font-size: clamp(0.6rem, 3vw, 0.75rem);
            text-align: center;
            outline: none;
            font-family: inherit;
        }

        .input-grupo input::placeholder {
            color: #8ab3cc;
            font-style: italic;
            font-size: 0.7rem;
        }

        .botones {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .btn {
            background: #2a4a6a;
            border: none;
            color: #cceeff;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: clamp(0.55rem, 2.5vw, 0.65rem);
            cursor: pointer;
            font-weight: bold;
        }

        .btn:active { transform: scale(0.96); }

        .micro-btn.grabando {
            background: #a33;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .estado {
            font-size: clamp(0.5rem, 2.2vw, 0.6rem);
            color: #8ab3cc;
            margin-top: 8px;
            text-align: center;
            opacity: 0.7;
        }

        .info-externa {
            position: fixed;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.6rem;
            color: #668;
            background: rgba(0,0,0,0.5);
            padding: 6px;
            backdrop-filter: blur(4px);
        }

        .brillo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent 70%);
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="scene" id="scene">
        <div class="bola" id="bola">
            <div class="cara front">
                <div class="numero-8"><span>8</span></div>
                <div class="brillo"></div>
            </div>
            <div class="cara back">
                <div class="triangulo">
                    <div class="contenido-triangulo">
                        <div class="respuesta">
                            <div class="frase" id="frase">🎱 Pregúntame...</div>
                            <div class="autor" id="autor">— Bola Mágica 8</div>
                        </div>
                        <div class="input-grupo">
                            <input type="text" id="preguntaInput" placeholder="Escribe tu pregunta..." autocomplete="off">
                        </div>
                        <div class="botones">
                            <button class="btn" id="preguntarBtn">🔮 Preguntar</button>
                            <button class="btn micro-btn" id="microBtn">🎤 Hablar</button>
                        </div>
                        <div class="estado" id="estadoMsg"></div>
                    </div>
                </div>
                <div class="brillo"></div>
            </div>
        </div>
    </div>
</div>
<div class="info-externa" id="infoExterna">📱 Toca la bola para girarla | Agita para respuesta aleatoria</div>

<script>
    // ============================================================
    // FRASES
    // ============================================================
    const frasesNormales = {
        amor: ["«Amar es encontrar en la felicidad de otro tu propia felicidad.» — Leibniz","«El amor no se mira, se siente.» — Sabina","«Te quiero no por quien eres, sino por quien soy cuando estoy contigo.» — García Márquez"],
        trabajo: ["«Elige un trabajo que te guste y no trabajarás ni un día.» — Confucio","«El 90% del éxito es presentarse.» — Woody Allen","«La única manera de hacer un gran trabajo es amar lo que haces.» — Steve Jobs"],
        futuro: ["«El futuro pertenece a los que creen en sus sueños.» — Eleanor Roosevelt","«El mejor modo de predecir el futuro es creándolo.» — Peter Drucker","«El futuro no está escrito, somos nosotros quienes lo creamos.»"],
        dinero: ["«El dinero no trae la felicidad, pero la compra.»","«No es rico el que más tiene, sino el que menos necesita.»","«Gana dinero mientras duermes, o trabajarás hasta que te mueras.» — Buffett"],
        familia: ["«La familia no es cuestión de sangre, sino de respeto y alegría.» — Bach","«La familia te quiere sin preguntar.»","«La familia es donde aprendemos a amar.» — Papa Francisco"],
        amigos: ["«Un amigo es quien lo sabe todo de ti y aún así te quiere.» — Hubbard","«Los amigos son la familia que eliges.» — Scott","«La amistad duplica las alegrías y divide las angustias.» — Bacon"],
        exito: ["«El éxito no es la clave de la felicidad. La felicidad es la clave del éxito.» — Schweitzer","«El éxito es ir de fracaso en fracaso sin desesperarse.» — Churchill","«El éxito es obtener lo que deseas; la felicidad, disfrutarlo.» — Emerson"],
        vida: ["«La vida es lo que pasa mientras haces otros planes.» — John Lennon","«La vida es como una bicicleta: para mantener el equilibrio, sigue adelante.» — Einstein","«Vive como si fueras a morir mañana, aprende como si fueras a vivir siempre.» — Gandhi"]
    };

    const frasesExtranas = [
        "«Los pingüinos usan esmoquin porque no tienen armario para chaquetas.» — Anónimo",
        "«Si un libro se aburre, cámbiale la pila.» — Alicia",
        "«El tiempo vuela como un coche sin ruedas.» — Proverbio marciano",
        "«La Luna es un queso que nunca se acaba porque los ratones son astronautas.» — Teoría galáctica",
        "«Las nubes no lloran, sudan emociones.» — Meteoro loco",
        "«El silencio tiene eco si gritas muy fuerte hacia adentro.» — Poeta invisible",
        "«Los árboles bailan cumbia cuando nadie mira.» — Botánica imaginaria",
        "«El agua hierve al revés en el país de los espejos.» — Alicia vuelve",
        "«Un tren puede silbar una canción de cuna si le cantas primero.» — Maquinista onírico",
        "«El arcoíris es solo el bigote del sol.» — Astronomía disparatada",
        "«Los calcetines desaparecen porque viajan al futuro a buscarse a sí mismos.» — Teoría del caos textil"
    ];

    const frasesGenerales = ["«La sabiduría comienza en la reflexión.» — Sócrates","«Solo sé que no sé nada.» — Sócrates","«Pienso, luego existo.» — Descartes"];

    let temasActivos = ['amor', 'trabajo', 'futuro', 'dinero', 'familia', 'amigos', 'exito', 'vida'];
    let reconocimiento = null;
    let grabando = false;
    let girada = false;
    let ultimoAgite = 0, ultimaX = 0, ultimaY = 0, ultimaZ = 0;

    const bola = document.getElementById('bola');
    const scene = document.getElementById('scene');
    const fraseDiv = document.getElementById('frase');
    const autorDiv = document.getElementById('autor');
    const preguntaInput = document.getElementById('preguntaInput');
    const preguntarBtn = document.getElementById('preguntarBtn');
    const microBtn = document.getElementById('microBtn');
    const estadoMsg = document.getElementById('estadoMsg');

    function girarBola() { bola.style.transform = 'rotateY(180deg)'; girada = true; }
    function regresarBola() { bola.style.transform = 'rotateY(0deg)'; girada = false; }
    function toggleBola() { girada ? regresarBola() : girarBola(); }

    setTimeout(() => { bola.style.animation = 'none'; bola.style.transform = 'rotateY(0deg)'; }, 1000);

    function obtenerRespuestaNormal() {
        let pool = [];
        for (let tema of temasActivos) if (frasesNormales[tema]) pool.push(...frasesNormales[tema]);
        if (pool.length === 0) pool = frasesGenerales;
        return pool[Math.floor(Math.random() * pool.length)];
    }

    function obtenerRespuestaExtrana() { return frasesExtranas[Math.floor(Math.random() * frasesExtranas.length)]; }

    function mostrarRespuesta(respuesta) {
        const partes = respuesta.split(' — ');
        fraseDiv.innerHTML = partes[0];
        autorDiv.innerHTML = '— ' + (partes[1] || 'Bola Mágica 8');
        estadoMsg.innerHTML = '✨';
        setTimeout(() => { if (estadoMsg.innerHTML === '✨') estadoMsg.innerHTML = ''; }, 1500);
    }

    function procesarPregunta(texto) {
        if (!texto || !texto.trim()) {
            const respuesta = obtenerRespuestaExtrana();
            mostrarRespuesta(respuesta);
            preguntaInput.value = '';
            if (!girada) girarBola();
            setTimeout(() => regresarBola(), 3500);
            return;
        }
        const respuesta = obtenerRespuestaNormal();
        mostrarRespuesta(respuesta);
        preguntaInput.value = '';
        if (!girada) girarBola();
        setTimeout(() => regresarBola(), 3500);
    }

    function respuestaAleatoria() {
        const esExtrana = Math.random() < 0.5;
        mostrarRespuesta(esExtrana ? obtenerRespuestaExtrana() : obtenerRespuestaNormal());
        if (!girada) girarBola();
        setTimeout(() => regresarBola(), 3500);
    }

    // Micrófono
    function iniciarMicrofono() {
        if (!('webkitSpeechRecognition' in window)) { estadoMsg.innerHTML = '❌ Voz no soportada'; return; }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        reconocimiento = new SpeechRecognition();
        reconocimiento.lang = 'es-ES';
        reconocimiento.onstart = () => { grabando = true; microBtn.classList.add('grabando'); microBtn.textContent = '🔴'; estadoMsg.innerHTML = '🎤'; };
        reconocimiento.onresult = (e) => { procesarPregunta(e.results[0][0].transcript); detenerMicrofono(); };
        reconocimiento.onerror = () => detenerMicrofono();
        reconocimiento.onend = () => detenerMicrofono();
        reconocimiento.start();
    }
    function detenerMicrofono() { if (reconocimiento) try { reconocimiento.stop(); } catch(e) {} grabando = false; microBtn.classList.remove('grabando'); microBtn.textContent = '🎤'; if (estadoMsg.innerHTML === '🎤') estadoMsg.innerHTML = ''; }
    function toggleMicrofono() { grabando ? detenerMicrofono() : iniciarMicrofono(); }

    // Movimiento
    function iniciarDeteccionMovimiento() {
        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', (e) => {
                const ahora = Date.now();
                if (ahora - ultimoAgite < 800) return;
                const acc = e.accelerationIncludingGravity;
                if (!acc) return;
                const fuerza = Math.abs((acc.x||0)-ultimaX) + Math.abs((acc.y||0)-ultimaY) + Math.abs((acc.z||0)-ultimaZ);
                if (fuerza > 25) { ultimoAgite = ahora; respuestaAleatoria(); }
                ultimaX = acc.x||0; ultimaY = acc.y||0; ultimaZ = acc.z||0;
            });
        }
    }

    function solicitarPermisoMovimiento() {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission().then(r => { if (r === 'granted') iniciarDeteccionMovimiento(); });
        } else iniciarDeteccionMovimiento();
    }

    scene.addEventListener('click', toggleBola);
    preguntarBtn.addEventListener('click', () => procesarPregunta(preguntaInput.value));
    preguntaInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') procesarPregunta(preguntaInput.value); });
    microBtn.addEventListener('click', toggleMicrofono);

    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
        const btn = document.createElement('div');
        btn.innerText = '🎯 Activar agitado';
        btn.style.cssText = 'position:fixed;bottom:55px;left:50%;transform:translateX(-50%);background:#2a4a6a;color:#ccf;padding:6px 12px;border-radius:30px;font-size:0.65rem;z-index:100;cursor:pointer';
        btn.onclick = solicitarPermisoMovimiento;
        document.body.appendChild(btn);
    } else if (window.DeviceMotionEvent) iniciarDeteccionMovimiento();
</script>
</body>
</html>
